<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#0a1410;--bg2:#0f1d16;--panel:#13241c;--panel2:#1a2e24;--line:#234034;--line2:#2f5444;
  --txt:#e9f3ec;--muted:#8fa89a;--dim:#5f7a6c;
  --grass:#2fcf6b;--grass-d:#1aa353;--grass-glow:rgba(47,207,107,.20);
  --gold:#ffc23d;--gold-d:#e09e15;--bad:#ff5d63;
  --display:'Anton',system-ui,sans-serif;--cond:'Barlow Condensed',system-ui,sans-serif;--body:'Barlow',system-ui,'Segoe UI',sans-serif;
  --r:11px;--sh:0 10px 34px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f5f7f6;--bg2:#ffffff;--panel:#ffffff;--panel2:#edf3ef;--line:#d9e4dd;--line2:#bdcec3;
  --txt:#17251d;--muted:#607268;--dim:#829188;
  --grass:#169c4b;--grass-d:#0d7e3b;--grass-glow:rgba(22,156,75,.14);
  --gold:#b97800;--gold-d:#925d00;--bad:#cf3841;--sh:0 8px 28px rgba(25,55,38,.09);
  color-scheme:light;
}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"] body{background:repeating-linear-gradient(115deg,rgba(15,90,45,.018) 0 60px,transparent 60px 120px),radial-gradient(1100px 560px at 82% -8%,#e1f3e7 0%,transparent 55%),radial-gradient(820px 460px at -8% 108%,#e4f1f0 0%,transparent 50%),var(--bg)}
html[data-theme="light"] header{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.88))}
html[data-theme="light"] .btn:hover{color:var(--txt)}
html[data-theme="light"] .btn.primary{color:#fff}
html[data-theme="light"] .badge{color:#fff}
.theme-toggle{min-width:38px;justify-content:center;padding-left:10px!important;padding-right:10px!important}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.45;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 60px,transparent 60px 120px),radial-gradient(1100px 560px at 82% -8%,#15402a 0%,transparent 55%),radial-gradient(820px 460px at -8% 108%,#0e2c34 0%,transparent 50%),var(--bg);}
h1,h2,h3,h4,h5{margin:0;font-family:var(--cond);font-weight:700;letter-spacing:.3px}
.display{font-family:var(--display);font-weight:400;letter-spacing:1px}
button{cursor:pointer;font-family:var(--body)}input,select{font-family:var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 90px}
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,20,16,.97),rgba(10,20,16,.8));backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.badge{width:46px;height:46px;border-radius:13px;background:linear-gradient(140deg,var(--grass),var(--grass-d));display:grid;place-items:center;box-shadow:0 0 24px var(--grass-glow);color:#062e16}
.badge svg{width:28px;height:28px}
.logo b{font-family:var(--display);font-size:25px;color:var(--txt);letter-spacing:3px;line-height:.9;font-weight:400}
.logo span{display:block;font-family:var(--cond);font-size:11px;color:var(--grass);letter-spacing:3px;text-transform:uppercase;font-weight:600}
.hd-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--txt);padding:9px 15px;border-radius:8px;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--grass);color:#fff}
.btn.primary{background:linear-gradient(135deg,var(--grass),var(--grass-d));border:none;color:#062e16}
.btn.primary:hover{filter:brightness(1.09)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));border:none;color:#3a2a00}
.btn.ghost{background:transparent}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.block{width:100%;justify-content:center;padding:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:22px}.muted{color:var(--muted)}.dim{color:var(--dim)}.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}
.tag.acc{color:var(--grass);border-color:var(--grass-d)}.tag.gold{color:var(--gold);border-color:var(--gold-d)}
.tag.live{color:var(--grass);border-color:var(--grass-d)}.tag.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grass);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
label.fld{display:block;margin:0 0 16px}
label.fld>span{display:block;font-family:var(--cond);font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px;font-weight:600}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:15px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--grass);box-shadow:0 0 0 3px var(--grass-glow)}
textarea{resize:vertical;min-height:130px;font-family:var(--body)}
.hint{font-size:12px;color:var(--dim);margin-top:5px}hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0}
.hero{padding:48px 0 26px;text-align:center}
.hero h1{font-family:var(--display);font-size:clamp(34px,6.4vw,64px);line-height:.95;font-weight:400;letter-spacing:1px}
.hero h1 em{color:var(--grass);font-style:normal;text-shadow:0 0 30px var(--grass-glow)}
.hero p{color:var(--muted);max-width:620px;margin:16px auto 0;font-size:16px;font-family:var(--cond);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.fmt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.fmt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.fmt:hover{border-color:var(--grass);transform:translateY(-3px)}.fmt.sel{border-color:var(--grass);box-shadow:0 0 0 3px var(--grass-glow)}
.fmt .ic{font-size:28px;margin-bottom:7px}.fmt h3{font-size:19px;margin-bottom:4px}.fmt p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.4}
.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.saved{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.saved:hover{border-color:var(--line2)}.saved h4{font-size:18px}.saved .meta{font-size:12px;color:var(--dim)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto;flex-wrap:wrap}
.tab{padding:11px 15px;background:none;border:none;color:var(--muted);font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.6px;border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase}
.tab:hover{color:var(--txt)}.tab.active{color:var(--grass);border-bottom-color:var(--grass)}
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.7px;font-size:12px;color:var(--muted);text-align:center;padding:9px 7px;border-bottom:2px solid var(--line2)}
.tabela th.l,.tabela td.l{text-align:left}
.tabela td{padding:10px 7px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tabela tbody tr:hover{background:var(--panel2)}.tabela .pos{font-family:var(--display);font-weight:400;color:var(--muted);width:30px}
.tabela .team{font-weight:600;text-align:left}.tabela .pts{font-weight:700;color:var(--grass);font-size:15px}
.qz{box-shadow:inset 3px 0 0 var(--grass)}.qz2{box-shadow:inset 3px 0 0 var(--gold)}
.grp-title{font-family:var(--cond);font-size:21px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:1px}
.grp-title .ln{flex:1;height:1px;background:var(--line)}
.gscore{display:flex;gap:14px;justify-content:center;align-items:center;margin:6px 0 18px;font-family:var(--cond)}
.gscore .gb{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 20px;text-align:center;min-width:120px}
.gscore .gb b{display:block;font-family:var(--display);font-size:30px;color:var(--grass)}.gscore .gb.lead b{color:var(--gold)}.gscore .vs{font-family:var(--display);color:var(--dim);font-size:20px}
.rodada{margin-bottom:22px}.rodada h4{font-family:var(--cond);font-size:15px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.rodada h4 .num{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:2px 9px;color:var(--grass);font-size:14px}
.match{display:grid;grid-template-columns:1fr 96px 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.match.done{border-color:var(--line2)}.match .home{text-align:right;font-weight:600}.match .away{text-align:left;font-weight:600}
.match .sc{display:flex;align-items:center;justify-content:center;gap:5px}
.match .sc input{width:42px;text-align:center;padding:6px 2px;font-weight:700;font-size:16px}
.match .sc .x{color:var(--dim);font-weight:700}.match .w{color:var(--grass)}
.match .sc b{font-family:var(--display);font-size:20px;min-width:24px}
.match .meta-in{grid-column:1/-1;margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.match .meta-in input{font-size:12px;padding:6px 9px;background:var(--bg2);flex:1;min-width:160px}
.lnk{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:5px 8px;border-radius:6px}.lnk:hover{color:var(--grass);background:var(--panel2)}
.bracket{display:flex;gap:30px;overflow-x:auto;padding:10px 4px 24px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;min-width:222px;gap:16px}
.bcol h5{font-family:var(--cond);text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-size:13px;text-align:center;margin-bottom:4px}
.tie{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tie .side{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;gap:8px;border-bottom:1px solid var(--line)}
.tie .side:last-of-type{border-bottom:none}.tie .side.win{background:var(--grass-glow)}
.tie .side .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.tie .side.win .nm{color:var(--grass)}.seedstar{color:var(--gold);font-size:11px}
.tie .side .agg{display:flex;gap:4px;align-items:center}.tie .side .agg input{width:34px;text-align:center;padding:4px 2px;font-weight:700}
.tie .side .agg b{font-family:var(--display);font-size:16px}
.tie .pen,.tie .tinfo{font-size:11px;padding:6px 11px;border-top:1px dashed var(--line)}
.tie .pen{color:var(--gold)}.tie .tinfo input{font-size:11px;padding:5px 8px;background:var(--bg2)}
.champ{background:linear-gradient(135deg,rgba(255,194,61,.17),rgba(255,194,61,.04));border:1px solid var(--gold);border-radius:12px;padding:22px;text-align:center;align-self:center}
.champ .cup{font-size:36px}.champ .nm{font-family:var(--display);font-size:24px;color:var(--gold);margin-top:6px;letter-spacing:1px}
.draw-wrap{display:grid;grid-template-columns:280px 1fr;gap:22px}@media(max-width:760px){.draw-wrap{grid-template-columns:1fr}}
.pot{margin-bottom:16px}.pot h5{font-family:var(--cond);text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:13px;margin-bottom:8px}
.pchip{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-weight:600;font-size:14px;transition:.25s}
.pchip.taken{opacity:.28;text-decoration:line-through}.pchip.seed{border-color:var(--gold-d)}.pchip.seed .dot{background:var(--gold)}.pchip .dot{width:8px;height:8px;border-radius:50%;background:var(--grass)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:90px}
.gbox h5{font-family:var(--cond);font-size:16px;text-transform:uppercase;letter-spacing:1px;color:var(--grass);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;margin-bottom:5px;background:var(--bg2);border:1px dashed var(--line2);min-height:38px;font-weight:600;opacity:0;transform:translateY(8px);transition:.4s}
.slot.in{opacity:1;transform:none;border-style:solid}.slot.seed{border-color:var(--gold-d)}
.gboxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.seedpick{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.schip{background:var(--bg2);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.schip:hover{border-color:var(--gold-d)}.schip.on{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#3a2a00;border-color:transparent}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:480px;width:100%;padding:24px;box-shadow:var(--sh);max-height:88vh;overflow:auto}.modal h3{font-size:22px;margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(150%);background:var(--panel2);border:1px solid var(--grass-d);color:var(--txt);padding:12px 20px;border-radius:10px;z-index:200;transition:.35s;box-shadow:var(--sh);font-weight:600}.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:50px 20px;color:var(--dim)}.empty .ic{font-size:46px;opacity:.5}
.srow{display:grid;grid-template-columns:1fr 1.4fr 60px 32px;gap:7px;align-items:center;margin-bottom:7px}.srow input,.srow select{padding:7px 9px;font-size:14px}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(47,207,107,.10),transparent);border:1px solid var(--grass-d);border-radius:10px;padding:11px 14px;margin:14px 0}
.banner code{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--grass);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:140px}
.authwrap{max-width:420px;margin:10px auto 0}
.spin{width:34px;height:34px;border:3px solid var(--line2);border-top-color:var(--grass);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto}
.svg-ico{display:inline-flex;width:1.05em;height:1.05em;vertical-align:-.16em;align-items:center;justify-content:center;flex:none;color:currentColor}.svg-ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.svg-ico.icon-lg{width:1.35em;height:1.35em}.svg-ico.icon-xl{width:1.8em;height:1.8em}
@keyframes rot{to{transform:rotate(360deg)}}
/* ELENCO / ATLETAS */
.team-acc{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--panel)}
.team-acc>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:11px;font-weight:600;font-size:16px}
.team-acc>summary::-webkit-details-marker{display:none}
.team-acc>summary:hover{background:var(--panel2)}
.team-acc .crest{width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);object-fit:cover;display:grid;place-items:center;font-family:var(--display);color:var(--grass);font-size:15px}
.team-acc .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.team-body{padding:6px 16px 16px;border-top:1px solid var(--line)}
.staffbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.staff-h{font-family:var(--cond);text-transform:uppercase;letter-spacing:1px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.staff-r{display:flex;align-items:center;gap:8px}
.staff-r .staff-l{font-size:12px;color:var(--dim);min-width:96px}
.staff-r .staff-v{font-size:13px;font-weight:600}
.staff-r input{flex:1;padding:7px 9px;font-size:13px}
.critlist{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.critrow{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 11px}
.critrow.fixed{border-color:var(--grass-d);background:rgba(47,207,107,.07)}
.critrow .cnum{font-family:var(--display);color:var(--grass);min-width:18px;text-align:center}
.critrow .cname{font-weight:600;font-size:14px;flex:1}
.critrow .cbtns{display:flex;gap:2px}
.critrow .cbtns .lnk{padding:4px 8px;font-size:13px}
.critrow .cbtns .lnk.danger:hover{color:var(--bad)}
.ath{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.ath:last-child{border-bottom:none}
.ath .ph{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--panel2);border:1px solid var(--line2);flex-shrink:0;display:grid;place-items:center;color:var(--dim);font-size:16px;font-weight:700}
.ath .info{flex:1;min-width:0}
.ath .info b{font-weight:600;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ath .info span{font-size:12px;color:var(--muted)}
.ath .stats{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.ath .stats .st{display:inline-flex;align-items:center;gap:3px}
.cardico{width:11px;height:15px;border-radius:2px;display:inline-block;vertical-align:middle}
.cardico.y{background:var(--gold)}.cardico.r{background:var(--bad)}
.ball{font-size:13px}
.susp{color:var(--bad);font-size:11px;font-weight:700;border:1px solid var(--bad);border-radius:5px;padding:1px 6px}
.addath{display:grid;grid-template-columns:1fr 130px 80px;gap:7px;margin-top:10px;align-items:end}
@media(max-width:560px){.addath{grid-template-columns:1fr}}
.phpick{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.phpick .prev{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--dim)}
.evbtns{display:flex;gap:5px;flex-wrap:wrap}

const THEME_LS='arena_theme';
function preferredTheme(){
  const saved=localStorage.getItem(THEME_LS);
  if(saved==='light'||saved==='dark')return saved;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
}
function applyAppTheme(theme){
  theme=theme||preferredTheme();
  document.documentElement.setAttribute('data-theme',theme);
  const meta=document.getElementById('themeColorMeta');if(meta)meta.content=theme==='light'?'#ffffff':'#0a1410';
  document.querySelectorAll('[data-theme-toggle]').forEach(b=>{b.textContent=theme==='light'?'☾':'☀';b.title=theme==='light'?'Usar modo escuro':'Usar modo claro';b.setAttribute('aria-label',b.title);});
}
function toggleAppTheme(){const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';localStorage.setItem(THEME_LS,next);applyAppTheme(next);}
applyAppTheme();

function svgIcon(name){return `<span class="svg-ico" aria-hidden="true"><svg viewBox="0 0 24 24">${SVG_ICON_PATHS[name]||SVG_ICON_PATHS.info}</svg></span>`;}
function replaceEmojiIcons(root=document){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let n;while(n=walker.nextNode()){if(n.parentElement?.closest('script,style,textarea,input,[data-no-icon]'))continue;if(Object.keys(EMOJI_ICON_NAMES).some(x=>n.nodeValue.includes(x)))nodes.push(n);}for(const node of nodes){const frag=document.createDocumentFragment();let text=node.nodeValue;while(text){let hit=null;for(const emoji of Object.keys(EMOJI_ICON_NAMES)){const i=text.indexOf(emoji);if(i>=0&&(!hit||i<hit.i))hit={emoji,i};}if(!hit){frag.append(text);break;}if(hit.i)frag.append(text.slice(0,hit.i));frag.append(document.createRange().createContextualFragment(svgIcon(EMOJI_ICON_NAMES[hit.emoji])));text=text.slice(hit.i+hit.emoji.length);}node.replaceWith(frag);}}

function getConfig(){
  if(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey!=='COLE_AQUI')return FIREBASE_CONFIG;
  try{const c=JSON.parse(localStorage.getItem(CFG_LS));if(c&&c.apiKey)return c;}catch(e){}

}
function renderSetupFirebase(err){
  state=null;RO=false;$('#headerActions').innerHTML='';
  $('#app').innerHTML=`<div class="authwrap">
    <div class="hero" style="padding:30px 0 14px"><h1 style="font-size:40px">Configurar <em>ARENA</em></h1></div>
    <div class="card pad">
      <p class="muted" style="margin-top:0">Cole abaixo a configuração do seu projeto Firebase (objeto <code>firebaseConfig</code> que o console gera ao registrar um app Web).</p>
      ${err?`<p style="color:var(--bad);font-size:13px">${esc(err)}</p>`:''}
      <label class="fld"><span>firebaseConfig</span>
        <textarea id="cfgIn" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }'></textarea></label>
      <button class="btn primary block" onclick="saveConfig()">Salvar e iniciar</button>
      <p class="hint">A config do Firebase Web é pública por natureza (não é segredo). A proteção real vem das Regras de Segurança do Firestore — veja as instruções entregues com o app.</p>
    </div></div>`;
}
function saveConfig(){
  let raw=$('#cfgIn').value.trim();
  try{
    const m=raw.indexOf('{'); if(m>=0)raw=raw.slice(m, raw.lastIndexOf('}')+1);
    const obj=(new Function('return ('+raw+')'))();
    if(!obj||!obj.apiKey||!obj.projectId)throw new Error('Faltam apiKey/projectId');
    localStorage.setItem(CFG_LS,JSON.stringify(obj));
    toast('Configuração salva');boot();
  }catch(e){toast('Config inválida: '+e.message);}
}

  },
  payload(obj,u){const ownerUid=obj.ownerUid||u.uid,ownerEmail=obj.ownerEmail||u.email||'';const collaborators=Array.isArray(obj.collaborators)?obj.collaborators:[],active=collaborators.filter(c=>c.status!=='revoked'),emails=r=>active.filter(c=>c.role===r).map(c=>(c.email||'').toLowerCase()).filter(Boolean);return{ownerUid,ownerEmail,collaboratorEmails:active.map(c=>(c.email||'').toLowerCase()).filter(Boolean),adminEmails:emails('admin'),resultsEmails:emails('results'),registrationEmails:emails('registrations'),viewerEmails:emails('viewer'),public:true,nome:obj.nome||'Campeonato',formato:obj.formato,status:obj.status||'rascunho',updated:Date.now(),data:JSON.stringify(Object.assign({},obj,{ownerUid,ownerEmail,_catLoaded:undefined}))};},
  async get(id){if(DEMO_MODE){const x=demoChampionships.find(d=>d.id===id);return x?deep(x):null;}const s=await this.col().doc(id).get();return s.exists?this.parse(s):null;},
  parse(s){const x=s.data();let st;try{st=JSON.parse(x.data);}catch(e){st={};}st.id=s.id;st.ownerUid=x.ownerUid;st.ownerEmail=x.ownerEmail||st.ownerEmail||'';delete st._catLoaded;return st;},
  subscribe(id,cb){return this.col().doc(id).onSnapshot(s=>cb(s.exists?this.parse(s):null),e=>cb(null,e));},

};

const COLLAB_ROLES={admin:{name:'Administrador',desc:'Pode gerenciar praticamente todo o campeonato.'},results:{name:'Resultados e súmulas',desc:'Pode operar partidas, placares, eventos e consultar competição.'},registrations:{name:'Inscrições',desc:'Pode analisar inscrições, equipes e atletas.'},viewer:{name:'Leitura interna',desc:'Pode acessar o painel sem editar dados.'}};
function ensureCollaborators(){if(!state)return;state.collaborators=Array.isArray(state.collaborators)?state.collaborators:[];}

function myRole(){if(isOwner())return'owner';const c=myCollaborator();return c?c.role:'none';}
function can(permission){const r=myRole();if(r==='owner'||r==='admin')return true;if(r==='results')return ['view','results'].includes(permission);if(r==='registrations')return ['view','registrations'].includes(permission);if(r==='viewer')return permission==='view';return false;}

<div class="card pad"><span class="tag acc">AVISO DE PRIVACIDADE ${ARENA_PRIVACY_VERSION}</span><h3 style="margin-top:12px">Como o ARENA trata dados pessoais</h3><p class="muted">O ARENA é uma plataforma de gestão de campeonatos. Dependendo do uso, podem ser tratados dados de conta (nome, e-mail e autenticação), dados de responsáveis por inscrições (nome, telefone e e-mail), dados de atletas e comissão técnica (nome, nascimento, número, foto quando adicionada), dados de colaboradores, oficiais e registros esportivos como partidas, gols, cartões e suspensões.</p><div class="lgpd-grid"><div class="lgpd-box"><h4>Finalidades</h4><p class="muted">Criar e administrar competições; receber e analisar inscrições; montar equipes e credenciais; operar partidas; calcular classificação, disciplina e estatísticas; gerar relatórios; publicar informações esportivas configuradas para acompanhamento.</p></div><div class="lgpd-box"><h4>Quem decide</h4><p class="muted">O organizador que cadastra participantes e define como os dados serão usados normalmente toma as decisões sobre o tratamento no campeonato. O papel jurídico exato do ARENA e do organizador deve ser formalizado nos Termos e contratos antes da operação comercial.</p></div><div class="lgpd-box"><h4>Compartilhamento</h4><p class="muted">Dados podem ser processados pela infraestrutura necessária ao serviço, atualmente incluindo Firebase/Google para autenticação e banco. A projeção pública do campeonato deve conter somente os dados necessários à divulgação esportiva.</p></div><div class="lgpd-box"><h4>Retenção</h4><p class="muted">O produto deve manter dados apenas enquanto necessários às finalidades informadas, obrigações legais e defesa de direitos. A política comercial definitiva ainda precisa definir prazos objetivos de retenção e exclusão.</p></div></div><h3>Direitos do titular</h3><p class="muted">O titular pode solicitar, conforme aplicável, confirmação e acesso aos dados, correção, informações sobre compartilhamento, anonimização/bloqueio/eliminação quando cabível, portabilidade nos termos regulamentares, revogação de consentimento quando esta for a base utilizada e revisão das situações previstas em lei. Solicitações relativas a dados de participantes devem ser encaminhadas ao organizador responsável pelo campeonato.</p><h3 style="margin-top:18px">Crianças e adolescentes</h3><div class="banner"><b>Atenção:</b> o ARENA pode ser usado em campeonatos escolares e conter dados de menores. Antes da operação comercial, deve existir fluxo específico para tratamento de dados de crianças e adolescentes, com informação clara ao responsável e definição da base legal adequada. O checkbox atual de inscrição é apenas uma confirmação operacional e não deve ser tratado, sozinho, como solução jurídica completa.</div><h3 style="margin-top:18px">Segurança</h3><p class="muted">O sistema separa dados administrativos da projeção pública e prepara regras de autorização no Firestore. Em produção ainda são necessários testes das regras, política de incidentes, controle de fornecedores, backups, registros de acesso adequados e revisão periódica das permissões.</p><h3 style="margin-top:18px">Canal de privacidade</h3><p class="muted">Antes do lançamento comercial, cadastre um e-mail oficial de privacidade/suporte e identifique a pessoa jurídica responsável pelo ARENA. Esses dados não foram fornecidos neste projeto e, por isso, não foram inventados.</p></div>
<div class="card pad" style="margin-top:14px"><h3>Registro simplificado de tratamento</h3><div style="overflow:auto"><table class="tabela"><thead><tr><th class="l">Operação</th><th class="l">Dados</th><th class="l">Finalidade</th><th class="l">Acesso</th></tr></thead><tbody><tr><td class="team">Conta</td><td class="team">Nome, e-mail, autenticação, plano</td><td class="team">Acesso e prestação do serviço</td><td class="team">Titular e administração autorizada</td></tr><tr><td class="team">Inscrição</td><td class="team">Responsável, contato, equipe, atletas</td><td class="team">Análise e formação da competição</td><td class="team">Organizador/perfis autorizados</td></tr><tr><td class="team">Competição</td><td class="team">Atletas, equipes, eventos esportivos</td><td class="team">Súmula, classificação, disciplina, relatórios</td><td class="team">Gestão; parte pode ser pública conforme configuração</td></tr><tr><td class="team">Publicação</td><td class="team">Dados esportivos sanitizados</td><td class="team">Acompanhamento do campeonato</td><td class="team">Público</td></tr></tbody></table></div></div>`;}
function renderAuditCenter(){state=null;renderHeaderActions();$('#app').innerHTML=`<div style="margin:24px 0"><button class="btn ghost sm" onclick="renderHome()">← Meus campeonatos</button></div><div class="hero" style="padding-top:12px"><h1>AUDITORIA GERAL <em>ARENA 2.0</em></h1><p>Revisão funcional, UX, segurança, privacidade e prontidão comercial.</p></div><div class="card pad"><h3>Resumo executivo</h3><div class="lgpd-grid"><div class="lgpd-box"><h4 class="audit-ok">✓ Base funcional forte</h4><p class="muted">Categorias, fases, progressão, partidas, classificação, disciplina negativa, inscrições, relatórios, portal público, identidade e permissões já formam um beta consistente.</p></div><div class="lgpd-box"><h4 class="audit-warn">⚠ Beta, não produção plena</h4><p class="muted">Checkout Pix ainda depende de conferência manual; regras Firestore precisam ser publicadas/testadas; LGPD precisa de identidade jurídica, canal oficial e política de retenção.</p></div><div class="lgpd-box"><h4 class="audit-bad">! Risco arquitetural</h4><p class="muted">O aplicativo continua concentrado em um único HTML e persiste grande parte do campeonato como JSON em um documento Firestore. Isso limita escalabilidade, consultas, auditoria e concorrência de edições.</p></div></div><h3 style="margin-top:18px">Achados prioritários</h3><div class="alert-row"><b>P0 — Firestore Rules</b><span class="tag bad">TESTAR ANTES DE LANÇAR</span></div><p class="hint">Validar com contas reais cada perfil e tentativas de acesso indevido. A regra pública de inscrição também deve limitar campos, tamanhos e abuso.</p><div class="alert-row"><b>P0 — Dados de menores</b><span class="tag bad">FLUXO ESPECÍFICO</span></div><p class="hint">Campeonatos escolares podem tratar dados de crianças/adolescentes. Não publicar nascimento, telefone, e-mail ou foto por padrão. Definir base legal, informação ao responsável e política de imagem.</p><div class="alert-row"><b>P0 — Cobrança</b><span class="tag bad">NÃO AUTOMATIZADA</span></div><p class="hint">A chave Pix não comprova pagamento. Não liberar plano pago pelo clique do usuário. Integrar provedor/webhook antes de escalar.</p><div class="alert-row"><b>P1 — Modelo de dados</b><span class="tag">REFATORAR</span></div><p class="hint">Migrar gradualmente campeonato, equipes, atletas, partidas e eventos para documentos/subcoleções. Evita documento gigante e conflitos de gravação.</p><div class="alert-row"><b>P1 — Auditoria de alterações</b><span class="tag">ADICIONAR</span></div><p class="hint">Registrar quem alterou placar, cartão, inscrição, fase e permissões, com data/hora e valor anterior quando relevante.</p><div class="alert-row"><b>P1 — Exclusão/retensão LGPD</b><span class="tag">ADICIONAR</span></div><p class="hint">Criar rotina de exclusão/anonimização de conta e participante e definir prazos de retenção. Excluir campeonato hoje apaga documentos principais, mas não constitui uma política completa de ciclo de vida.</p><div class="alert-row"><b>P1 — Inscrição pública</b><span class="tag">ENDURECER</span></div><p class="hint">Adicionar anti-spam/rate limit, validação de telefone/e-mail, tamanho máximo dos textos e proteção contra inscrições automatizadas.</p><div class="alert-row"><b>P2 — UX</b><span class="tag acc">BOA DIREÇÃO</span></div><p class="hint">Separação gestor/público está correta. Próximo polimento: busca, filtros, estados vazios consistentes, confirmação em ações destrutivas e acessibilidade por teclado/leitor de tela.</p><div class="alert-row"><b>P2 — PWA</b><span class="tag">VALIDAR INSTALAÇÃO</span></div><p class="hint">Testar manifest, service worker, ícones, cache/offline e atualização em iOS/Android no domínio HTTPS definitivo.</p></div><div class="card pad" style="margin-top:14px"><h3>Gate para beta</h3><p class="muted"><b>Recomendação:</b> liberar primeiro para poucos organizadores conhecidos após concluir P0. Não vender em escala até segurança, cobrança, privacidade de menores e recuperação/backup terem sido testados.</p></div>`;}
const FIRESTORE_PRODUCTION_RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function superadmin() { return signedIn() && exists(/databases/$(database)/documents/platformAdmins/$(request.auth.uid)) && get(/databases/$(database)/documents/platformAdmins/$(request.auth.uid)).data.role == 'superadmin'; }
    function email() { return signedIn() ? request.auth.token.email : null; }
    function champ(cid) { return get(/databases/$(database)/documents/championships/$(cid)); }
    function owner(d) { return signedIn() && d.ownerUid == request.auth.uid; }
    function admin(d) { return signedIn() && email() in d.adminEmails; }
    function results(d) { return signedIn() && (admin(d) || email() in d.resultsEmails); }
    function registrations(d) { return signedIn() && (admin(d) || email() in d.registrationEmails); }
    function internalViewer(d) { return signedIn() && (owner(d) || admin(d) || results(d) || registrations(d) || email() in d.viewerEmails); }

    match /championships/{cid} {
      allow create: if signedIn() && request.resource.data.ownerUid == request.auth.uid;
      allow read: if superadmin() || internalViewer(resource.data);
      allow update: if superadmin() || (internalViewer(resource.data)
        && request.resource.data.ownerUid == resource.data.ownerUid
        && (owner(resource.data) || (
          request.resource.data.adminEmails == resource.data.adminEmails &&
          request.resource.data.resultsEmails == resource.data.resultsEmails &&
          request.resource.data.registrationEmails == resource.data.registrationEmails &&
          request.resource.data.viewerEmails == resource.data.viewerEmails &&
          request.resource.data.collaboratorEmails == resource.data.collaboratorEmails
        )));
      allow delete: if superadmin() || owner(resource.data);

      match /auditLogs/{logId} {
        allow read: if internalViewer(champ(cid).data);
        allow create: if internalViewer(champ(cid).data) && request.auth != null && request.resource.data.actorUid == request.auth.uid;
        allow update, delete: if false;
      }

      match /registrations/{rid} {
        allow create: if request.resource.data.status == 'pending'
          && request.resource.data.teamName is string
          && request.resource.data.responsible is string
          && request.resource.data.phone is string
          && request.resource.data.athletes is list
          && request.resource.data.athletes.size() <= 100;
        allow read, update: if registrations(champ(cid).data) || owner(champ(cid).data);
        allow delete: if owner(champ(cid).data);
      }
    }

    match /publicChampionships/{cid} {
      allow read: if true;
      allow create, update, delete: if superadmin() || (signedIn() && owner(champ(cid).data));
    }

    match /users/{uid} {
      allow read: if superadmin() || (signedIn() && request.auth.uid == uid);
       allow create: if signedIn() && request.auth.uid == uid
         && (!request.resource.data.keys().hasAny(['admin','role']))
         && request.resource.data.billing.status == 'pending';
       allow update: if superadmin() || (signedIn() && request.auth.uid == uid
         && (!request.resource.data.keys().hasAny(['admin','role']))
         && request.resource.data.billing.status == resource.data.billing.status);
      allow delete: if false;
    }

    match /platformAdmins/{uid} {
      allow read: if signedIn() && request.auth.uid == uid;
      allow write: if false;
    }
  }
}`;
function copyProductionRules(){navigator.clipboard?navigator.clipboard.writeText(FIRESTORE_PRODUCTION_RULES).then(()=>toast('Regras copiadas')).catch(()=>prompt('Copie as regras:',FIRESTORE_PRODUCTION_RULES)):prompt('Copie as regras:',FIRESTORE_PRODUCTION_RULES);}
function downloadProductionRules(){const b=new Blob([FIRESTORE_PRODUCTION_RULES],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='firestore.rules';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function renderSecurityCenter(){state=null;renderHeaderActions();$('#app').innerHTML=`<div style="margin:24px 0"><button class="btn ghost sm" onclick="renderHome()">← Meus campeonatos</button></div><div class="hero" style="padding-top:12px"><h1>PREPARAÇÃO PARA <em>PRODUÇÃO</em></h1><p>Segurança do banco, separação de dados públicos e validação de permissões.</p></div><div class="card pad"><h3>🔒 Arquitetura de dados</h3><p class="muted">A partir desta intervenção, o ARENA grava uma projeção sanitizada em <code>publicChampionships</code> para o portal público e mantém os dados administrativos em <code>championships</code>. Contatos privados de inscrição e colaboradores não são enviados para a projeção pública.</p><div class="alert-row"><b>✓ Portal público separado</b><span class="tag acc">IMPLEMENTADO</span></div><div class="alert-row"><b>✓ Perfis de acesso expostos em campos próprios para regras</b><span class="tag acc">IMPLEMENTADO</span></div><div class="alert-row"><b>✓ Inscrições públicas limitadas a criação; análise exige permissão</b><span class="tag acc">REGRAS PRONTAS</span></div><div class="alert-row"><b>⚠ Ativação de planos pagos</b><span class="tag">ADMIN / GATEWAY</span></div><p class="hint">Planos pagos continuam sem ativação automática. O cliente não recebe permissão para transformar um pagamento pendente em ativo.</p></div><div class="card pad" style="margin-top:14px"><h3>Firestore Security Rules</h3><p class="muted">Publique estas regras no Firebase Console antes de disponibilizar o ARENA comercialmente. Faça teste em ambiente separado antes de substituir regras existentes.</p><div class="row"><button class="btn primary" onclick="copyProductionRules()">Copiar regras</button><button class="btn ghost" onclick="downloadProductionRules()">Baixar firestore.rules</button></div><textarea readonly style="margin-top:14px;min-height:360px;font-family:monospace;font-size:12px">${esc(FIRESTORE_PRODUCTION_RULES)}</textarea></div><div class="card pad" style="margin-top:14px"><h3>Checklist antes de produção</h3><p class="muted">1. Publicar as regras. 2. Abrir e salvar cada campeonato antigo uma vez para gerar sua projeção pública. 3. Testar proprietário, administrador, resultados, inscrições e leitura interna com contas diferentes. 4. Testar inscrição em janela anônima. 5. Integrar gateway Pix antes de ativação automática de assinatura. 6. Revisar a Central LGPD e a Auditoria antes do beta.</p><div class="row"><button class="btn ghost sm" onclick="renderPrivacyCenter()">🛡️ Abrir LGPD</button><button class="btn ghost sm" onclick="renderAuditCenter()">✓ Abrir auditoria</button></div></div>`;}

function renderBetaHardening(){state=null;renderHeaderActions();$('#app').innerHTML=`<div style="margin:24px 0"><button class="btn ghost sm" onclick="renderHome()">← Meus campeonatos</button></div><div class="hero" style="padding-top:12px"><h1>BETA <em>HARDENING</em></h1><p>Checklist operacional antes dos primeiros campeonatos reais.</p></div><div class="card pad"><h3>Implementado nesta intervenção</h3><div class="alert-row"><b>✓ Audit Log funcional</b><span class="tag acc">NOVO</span></div><p class="hint">Placares, dados de partida e alterações de atleta passam a gerar histórico com usuário e horário. A base está pronta para ampliar a cobertura.</p><div class="alert-row"><b>✓ Formulário público endurecido</b><span class="tag acc">NOVO</span></div><p class="hint">Limites de tamanho, autocomplete e honeypot reduzem entradas inválidas e bots simples. Para produção, use também App Check e/ou endpoint servidor com rate limit.</p><div class="alert-row"><b>✓ Permissões críticas reforçadas</b><span class="tag acc">NOVO</span></div><p class="hint">Alterações de placar exigem perfil de resultados; edição de atleta exige inscrições/admin.</p></div><div class="card pad" style="margin-top:14px"><h3>Teste ponta a ponta obrigatório</h3><p class="muted">Execute em um projeto Firebase de teste: criar conta → criar campeonato → categoria → fase → inscrição anônima → aprovação → jogo → gol/cartão → classificação/disciplina → progressão → relatório → portal público → colaborador com permissão limitada.</p><div class="alert-row"><b>Firestore Rules</b><span class="tag bad">PUBLICAR + EMULADOR</span></div><div class="alert-row"><b>App Check</b><span class="tag">RECOMENDADO</span></div><div class="alert-row"><b>Backup/exportação</b><span class="tag">TESTAR RESTAURAÇÃO</span></div><div class="alert-row"><b>Pagamento Pix</b><span class="tag bad">CONTINUA MANUAL</span></div></div>`;}

let saveTimer=null;
function persist(){if(!state||RO)return;if(!can('results')&&!can('registrations')&&!can('admin'))return permissionDenied();if(state.categories)saveRootIntoActive();state.updated=Date.now();scheduleSave();}
function scheduleSave(){setSaveStat('salvando…');clearTimeout(saveTimer);saveTimer=setTimeout(doSave,700);}
async function doSave(){try{await Store.save(state);setSaveStat('✓ salvo');}catch(e){setSaveStat('⚠ erro');toast('Erro ao salvar: '+(e.message||e));}}
function setSaveStat(t){const el=$('#saveStat');if(el)el.textContent=t;}

/* ============================================================
   ARENA 2.0 — CATEGORIAS + FASES
   Categoria mantém equipes/elenco. Cada fase mantém formato, regras de
   disputa, grupos, partidas e chaveamento independentes. O motor legado
   continua operando nos campos raiz, sincronizados com a fase ativa.
   ============================================================ */
function deep(v){return JSON.parse(JSON.stringify(v));}
function phaseSnapshot(d){const ap=(d.categories&&d.activeCategoryId)?((d.categories.find(c=>c.id===d.activeCategoryId)||{}).phases||[]).find(p=>p.id===(d.categories.find(c=>c.id===d.activeCategoryId)||{}).activePhaseId):null;return{formato:d.formato||'liga',cfg:deep(d.cfg||{}),grupos:deep(d.grupos||[]),matches:deep(d.matches||[]),bracket:d.bracket?deep(d.bracket):null,participantTeamIds:deep(ap&&ap.participantTeamIds||null),progression:deep(ap&&ap.progression||null)};}
function newPhaseFromRoot(d,nome){return Object.assign({id:uid(),nome:nome||'Fase 1',ordem:1,status:'planejada'},phaseSnapshot(d));}
function ensurePhases(c,d){
  if(!Array.isArray(c.phases)||!c.phases.length){c.phases=[newPhaseFromRoot(d,'Fase principal')];c.activePhaseId=c.phases[0].id;}
  if(!c.activePhaseId||!c.phases.some(p=>p.id===c.activePhaseId))c.activePhaseId=c.phases[0].id;
}
function categorySnapshot(d){
  const old=(d.categories||[]).find(c=>c.id===d.activeCategoryId);
  return{teams:deep(d.teams||[]),phases:deep(old&&old.phases||[]),activePhaseId:old&&old.activePhaseId||null};
}
function ensureCategories(d){
  if(!d)return;
  if(!Array.isArray(d.categories)||!d.categories.length){const id=uid();const c={id,nome:'Categoria principal',ordem:1,teams:deep(d.teams||[]),phases:[],activePhaseId:null};ensurePhases(c,d);d.categories=[c];d.activeCategoryId=id;}
  if(!d.activeCategoryId||!d.categories.some(c=>c.id===d.activeCategoryId))d.activeCategoryId=d.categories[0].id;
  d.categories.forEach(c=>{if(!Array.isArray(c.teams))c.teams=deep(d.teams||[]);ensurePhases(c,d);});
  const c=d.categories.find(x=>x.id===d.activeCategoryId);
  if(c&&!d._catLoaded){loadCategoryIntoRoot(d,c);d._catLoaded=true;}
}
function activeCategory(){ensureCategories(state);return state.categories.find(c=>c.id===state.activeCategoryId)||state.categories[0];}
function activePhase(){const c=activeCategory();ensurePhases(c,state);return c.phases.find(p=>p.id===c.activePhaseId)||c.phases[0];}
function saveRootIntoActive(){if(!state||!state.categories)return;const c=state.categories.find(x=>x.id===state.activeCategoryId);if(!c)return;ensurePhases(c,state);c.teams=deep(state.teams||[]);const p=c.phases.find(x=>x.id===c.activePhaseId);if(p){const keepParticipants=p.participantTeamIds,keepProgression=p.progression;Object.assign(p,phaseSnapshot(state));p.participantTeamIds=keepParticipants||null;p.progression=keepProgression||null;}}
function loadPhaseIntoRoot(d,p){d.formato=p.formato||'liga';d.cfg=deep(p.cfg||{});d.grupos=deep(p.grupos||[]);d.matches=deep(p.matches||[]);d.bracket=p.bracket?deep(p.bracket):null;}
function loadCategoryIntoRoot(d,c){ensurePhases(c,d);d.teams=deep(c.teams||[]);loadPhaseIntoRoot(d,c.phases.find(p=>p.id===c.activePhaseId)||c.phases[0]);}
function switchCategory(id){if(!state||state.activeCategoryId===id)return;saveRootIntoActive();const c=state.categories.find(x=>x.id===id);if(!c)return;state.activeCategoryId=id;loadCategoryIntoRoot(state,c);state._catLoaded=true;currentTab='overview';persist();renderManage();}
function switchPhase(id){if(!state)return;saveRootIntoActive();const c=activeCategory(),p=c.phases.find(x=>x.id===id);if(!p)return;c.activePhaseId=id;loadPhaseIntoRoot(state,p);currentTab='overview';persist();renderManage();}
function categoryBar(){if(!state||!state.categories||state.categories.length<2)return'';return`<div class="catbar">${state.categories.map(c=>`<button class="catpill ${c.id===state.activeCategoryId?'active':''}" onclick="switchCategory('${c.id}')">${esc(c.nome)}</button>`).join('')}</div>`;}
function phaseBar(){const c=activeCategory();if(!c.phases||c.phases.length<2)return'';return`<div class="phasebar">${c.phases.map(p=>`<button class="phasepill ${p.id===c.activePhaseId?'active':''}" onclick="switchPhase('${p.id}')">${esc(p.nome)}</button>`).join('')}</div>`;}
function addCategory(){if(RO)return;saveRootIntoActive();const base=activeCategory();const id=uid(),n=state.categories.length+1;const cfg=deep(state.cfg||{});cfg.seedNames=[];const ph={id:uid(),nome:'Fase principal',ordem:1,status:'planejada',formato:'liga',cfg,grupos:[],matches:[],bracket:null};const c={id,nome:'Categoria '+n,ordem:n,teams:[],phases:[ph],activePhaseId:ph.id};state.categories.push(c);state.activeCategoryId=id;loadCategoryIntoRoot(state,c);persist();currentTab='categorias';renderManage();toast('Categoria criada');}
function renameCategory(id,v){const c=state.categories.find(x=>x.id===id);if(!c)return;c.nome=(v||'').trim()||'Categoria';persist();}
function removeCategory(id){if(state.categories.length<=1)return toast('O campeonato precisa ter pelo menos uma categoria');if(!confirm('Excluir esta categoria, suas fases, jogos e equipes?'))return;saveRootIntoActive();state.categories=state.categories.filter(c=>c.id!==id);if(state.activeCategoryId===id){state.activeCategoryId=state.categories[0].id;loadCategoryIntoRoot(state,state.categories[0]);}persist();renderManage();toast('Categoria excluída');}

function phaseParticipants(p){const ids=(p&&Array.isArray(p.participantTeamIds)&&p.participantTeamIds.length)?p.participantTeamIds:null;return ids?ids.map(id=>state.teams.findIndex(t=>t.id===id)).filter(i=>i>=0):state.teams.map((_,i)=>i);}
function phaseComplete(p){if(!p)return false;if(p.formato==='mata'){if(!p.bracket)return false;const last=p.bracket.rounds&&p.bracket.rounds[p.bracket.rounds.length-1];return !!(last&&last[0]&&winnerOf(last[0]));}return (p.matches||[]).length>0&&(p.matches||[]).every(m=>m.hg!=null&&m.ag!=null);}
function standingsForPhase(p,idxs,matches){const oldCfg=state.cfg;state.cfg=p.cfg||oldCfg;try{return computeStandings(idxs,matches||p.matches||[]);}finally{state.cfg=oldCfg;}}
function qualifiedFromPhase(p,mode,count){count=Math.max(1,+count||1);if(p.formato==='grupos'&&mode==='perGroup'){const out=[];(p.grupos||[]).forEach((g,gi)=>{const idxs=g.map(id=>state.teams.findIndex(t=>t.id===id)).filter(i=>i>=0);const ms=(p.matches||[]).filter(m=>(m.grupo||0)===gi);standingsForPhase(p,idxs,ms).slice(0,count).forEach(x=>out.push(state.teams[x.team].id));});return out;}
 if(p.formato==='mata'&&p.bracket){const last=p.bracket.rounds&&p.bracket.rounds[p.bracket.rounds.length-1];const w=last&&last[0]?winnerOf(last[0]):null;return w?[w]:[];}
 const idxs=phaseParticipants(p);return standingsForPhase(p,idxs,p.matches||[]).slice(0,count).map(x=>state.teams[x.team].id);}

function applyProgression(srcId){if(RO)return;saveRootIntoActive();const c=activeCategory(),src=c.phases.find(x=>x.id===srcId);if(!src||!src.progression||!src.progression.targetPhaseId)return toast('Configure a fase de destino');const target=c.phases.find(x=>x.id===src.progression.targetPhaseId);if(!target)return toast('Fase de destino não encontrada');if(!phaseComplete(src)&&!confirm('A fase ainda possui jogos pendentes. Avançar com a classificação atual?'))return;const ids=qualifiedFromPhase(src,src.progression.mode||'overall',src.progression.count||2);if(!ids.length)return toast('Ainda não há classificados definidos');target.participantTeamIds=[...new Set(ids)];target.status='planejada';target.grupos=[];target.matches=[];target.bracket=null;c.activePhaseId=target.id;loadPhaseIntoRoot(state,target);persist();currentTab='fases';renderManage();toast(ids.length+' classificados enviados para '+target.nome);}
function progressionSummary(p){if(!p.progression||!p.progression.targetPhaseId)return'Progressão não configurada';const c=activeCategory(),t=c.phases.find(x=>x.id===p.progression.targetPhaseId);const mode=p.progression.mode==='perGroup'?'por grupo':'geral';return `${p.progression.count||2} classificado(s) ${mode} → ${t?esc(t.nome):'fase removida'}`;}
function generateActivePhase(){
  if(RO)return;saveRootIntoActive();const c=activeCategory(),p=activePhase();const participants=phaseParticipants(p);if(participants.length<2)return toast('A fase precisa ter pelo menos 2 equipes participantes');
  p.grupos=[];p.matches=[];p.bracket=null;
  if(p.formato==='liga'){p.matches=buildFixtures(participants,p.cfg.turnos||1);}
  else if(p.formato==='grupos'){const ng=Math.max(1,Math.min(p.cfg.nGrupos||2,participants.length));p.grupos=Array.from({length:ng},()=>[]);participants.forEach((ti,i)=>p.grupos[i%ng].push(state.teams[ti].id));p.grupos.forEach((g,gi)=>{const idxs=g.map(id=>state.teams.findIndex(t=>t.id===id));buildFixtures(idxs,p.cfg.turnos||1).forEach(m=>{m.grupo=gi;p.matches.push(m);});});}
  else if(p.formato==='gxg'){if(participants.length<4)return toast('Interzonas precisa de pelo menos 4 equipes');p.grupos=[[],[]];participants.forEach((ti,i)=>p.grupos[i%2].push(state.teams[ti].id));const tmp={grupos:p.grupos,teams:state.teams,cfg:p.cfg,matches:[]};buildGxg(tmp);p.matches=tmp.matches;}
  else if(p.formato==='mata'){p.bracket=makeBracketFromOrdered(participants.map(i=>state.teams[i].id));}
  p.status='andamento';c.activePhaseId=p.id;loadPhaseIntoRoot(state,p);persist();renderManage();toast('Fase gerada');
}

ogressão de classificados</div><div class="row"><select style="flex:1;min-width:180px" onchange="setProgressTarget('${p.id}',this.value)"><option value="">Não configurada</option>${later.map(t=>`<option value="${t.id}" ${prog.targetPhaseId===t.id?'selected':''}>→ ${esc(t.nome)}</option>`).join('')}</select><select style="max-width:190px" onchange="setProgressMode('${p.id}',this.value)"><option value="overall" ${prog.mode!=='perGroup'?'selected':''}>Melhores no geral</option>${p.formato==='grupos'?`<option value="perGroup" ${prog.mode==='perGroup'?'selected':''}>Melhores de cada grupo</option>`:''}</select><label style="display:flex;align-items:center;gap:6px"><span class="dim" style="font-size:12px">Classificam</span><input type="number" min="1" value="${prog.count||2}" style="width:70px" onchange="setProgressCount('${p.id}',this.value)"></label>${prog.targetPhaseId?`<button class="btn primary sm" onclick="applyProgression('${p.id}')">Classificar →</button>`:''}</div><div class="hint">${progressionSummary(p)}. A ordem respeita os critérios da fase, inclusive Disciplina.</div></div>`:''}</div>`;}).join('')}<div class="banner"><b>Fluxo automático:</b> encerre a fase → o ARENA calcula os classificados usando os critérios configurados → envie-os para a próxima fase → gere os novos confrontos.</div></div>`;}

/* ============================================================
   MOTOR (tabela, classificação, sorteio, bracket) — testado
   ============================================================ */
function roundRobin(teams){let t=teams.slice();const bye=t.length%2!==0;if(bye)t.push(-1);const n=t.length,rounds=[];for(let r=0;r<n-1;r++){const g=[];for(let i=0;i<n/2;i++){let h=t[i],a=t[n-1-i];if(h!==-1&&a!==-1){if(r%2===1&&i===0)[h,a]=[a,h];g.push([h,a]);}}rounds.push(g);t.splice(1,0,t.pop());}return rounds;}
function buildFixtures(idxs,turnos){let rounds=roundRobin(idxs);if(turnos>=2)rounds=rounds.concat(rounds.map(g=>g.map(([h,a])=>[a,h])));const m=[];rounds.forEach((g,ri)=>g.forEach(([h,a])=>m.push({id:uid(),rodada:ri+1,home:h,away:a,hg:null,ag:null,info:'',scorers:[]})));return m;}
function buildGxg(d){const A=d.grupos[0].map(id=>d.teams.findIndex(t=>t.id===id));const B=d.grupos[1].map(id=>d.teams.findIndex(t=>t.id===id));const m=[];A.forEach((a,ai)=>B.forEach(b=>m.push({id:uid(),rodada:ai+1,home:a,away:b,hg:null,ag:null,info:'',scorers:[]})));if(d.cfg.turnos>=2)A.forEach((a,ai)=>B.forEach(b=>m.push({id:uid(),rodada:A.length+ai+1,home:b,away:a,hg:null,ag:null,info:'',scorers:[]})));d.matches=m;}
function emptyStat(i){return{team:i,P:0,J:0,V:0,E:0,D:0,GP:0,GC:0,SG:0,pct:0};}
function h2h(aIdx,bIdx,matches){
  // pontos do confronto direto entre dois times (3/1/0)
  let pa=0,pb=0;
  matches.forEach(m=>{if(m.hg==null||m.ag==null)return;
    if(m.home===aIdx&&m.away===bIdx){if(m.hg>m.ag)pa+=3;else if(m.hg<m.ag)pb+=3;else{pa++;pb++;}}
    else if(m.home===bIdx&&m.away===aIdx){if(m.hg>m.ag)pb+=3;else if(m.hg<m.ag)pa+=3;else{pa++;pb++;}}});
  return pa-pb; // >0 => a melhor
}
function computeStandings(idxs,matches){const map={};idxs.forEach(i=>map[i]=emptyStat(i));const winPts=(state&&state.cfg.winPts!=null)?state.cfg.winPts:3,drawPts=(state&&state.cfg.drawPts!=null)?state.cfg.drawPts:1,lossPts=(state&&state.cfg.lossPts!=null)?state.cfg.lossPts:0;matches.forEach(m=>{if(m.hg==null||m.ag==null)return;const H=map[m.home],A=map[m.away];if(H){H.J++;H.GP+=m.hg;H.GC+=m.ag;if(m.hg>m.ag){H.V++;H.P+=winPts;}else if(m.hg<m.ag){H.D++;H.P+=lossPts;}else{H.E++;H.P+=drawPts;}}if(A){A.J++;A.GP+=m.ag;A.GC+=m.hg;if(m.ag>m.hg){A.V++;A.P+=winPts;}else if(m.ag<m.hg){A.D++;A.P+=lossPts;}else{A.E++;A.P+=drawPts;}}});const arr=Object.values(map);
  // disciplina (pontos de fair-play)
  const yp=(state&&state.cfg.discYellow!=null)?state.cfg.discYellow:1;const rp=(state&&state.cfg.discRed!=null)?state.cfg.discRed:5;
  const byId={};idxs.forEach(i=>{if(state&&state.teams[i])byId[state.teams[i].id]=map[i];});
  matches.forEach(m=>{(m.events||[]).forEach(e=>{const s=byId[e.teamId];if(!s)return;if(e.type==='yellow'){s.CY=(s.CY||0)+1;}else if(e.type==='red'){s.CR=(s.CR||0)+1;}});});
  arr.forEach(s=>{s.SG=s.GP-s.GC;s.pct=s.J&&winPts>0?Math.round(s.P/(s.J*winPts)*1000)/10:0;s.CY=s.CY||0;s.CR=s.CR||0;s.DISC=-(s.CY*yp+s.CR*rp);});
  const order=(state&&state.cfg.criterios)||['P','V','SG','GP'];const legacyH2H=state&&!order.includes('CD')&&state.cfg.confrontoDireto!==false;
  arr.sort((a,b)=>{for(const c of order){if(c==='CD'){const h=h2h(b.team,a.team,matches);if(h!==0)return h;continue;}const dir=CRIT_DIR[c]||'desc';const diff=dir==='asc'?(a[c]-b[c]):(b[c]-a[c]);if(diff)return diff;}if(legacyH2H){const d=h2h(b.team,a.team,matches);if(d!==0)return d;}return 0;});return arr;}
function newTournament(fmt){return{id:uid(),created:Date.now(),updated:Date.now(),nome:'Novo Campeonato',subtitulo:'',descricao:'',dataInicio:'',dataFim:'',status:'rascunho',publico:true,branding:{logo:'',cover:'',accent:'#2fcf6b'},sponsors:[],venues:[],officials:[],formato:fmt,cfg:{turnos:2,criterios:['P','DISC','V','SG','GP'],nGrupos:2,classificam:2,maoUnica:false,seedNames:[],yellowLimit:3,terceiro:true,esporte:'futebol',discYellow:1,discRed:3,winPts:3,drawPts:1,lossPts:0},teams:[],grupos:[],matches:[],bracket:null,categories:[],activeCategoryId:null};}
const SPORTS={futebol:'Futebol',futsal:'Futsal',society:'Futebol Society',volei:'Voleibol',basquete:'Basquetebol',handebol:'Handebol',outro:'Outro'};
const FORMATS={liga:{ic:'🏆',nome:'Pontos Corridos',desc:'Todos contra todos, turno único ou ida e volta.'},grupos:{ic:'🌐',nome:'Fase de Grupos',desc:'Vários grupos + mata-mata cruzado dos classificados.'},gxg:{ic:'🆚',nome:'Grupo × Grupo',desc:'Interzonas: cada time do Grupo A enfrenta os do Grupo B.'},mata:{ic:'⚔️',nome:'Mata-Mata',desc:'Eliminatória direta. Jogo único ou ida/volta com pênaltis.'}};
const ROUND_NAMES={2:'Final',4:'Semifinal',8:'Quartas de final',16:'Oitavas de final',32:'16-avos',64:'32-avos'};
const CRIT_LABEL={P:'Pontos',V:'Vitórias',SG:'Saldo de gols',GP:'Gols pró',GC:'Gols contra',DISC:'Disciplina (fair-play)',CD:'Confronto direto'};
const CRIT_DIR={P:'desc',V:'desc',SG:'desc',GP:'desc',GC:'asc',DISC:'desc'};
const ALL_CRIT=['P','V','SG','GP','GC','DISC'];
const isSeed=name=>state&&state.cfg.seedNames&&state.cfg.seedNames.includes(name);
function drawGroups(teams,n,seedNames){const groups=Array.from({length:n},()=>[]);const seeds=shuffle(teams.filter(t=>seedNames.includes(t.nome)));const others=shuffle(teams.filter(t=>!seedNames.includes(t.nome)));const seq=[];seeds.forEach((t,i)=>{const gi=i%n;groups[gi].push(t);seq.push({gi,team:t,seed:true});});others.forEach(t=>{let gi=0;for(let k=1;k<n;k++)if(groups[k].length<groups[gi].length)gi=k;groups[gi].push(t);seq.push({gi,team:t,seed:false});});return{groups,seq};}
function seedOrder(n){let r=[1,2];while(r.length<n){const m=r.length*2+1,nr=[];r.forEach(x=>{nr.push(x);nr.push(m-x);});r=nr;}return r;}
function nextPow2(n){let p=1;while(p<n)p*=2;return p;}
function drawBracket(teams,seedNames){const size=nextPow2(teams.length);const pos=seedOrder(size);const slotByRank=pos.map((rank,slot)=>({rank,slot})).sort((a,b)=>a.rank-b.rank).map(o=>o.slot);const slots=Array(size).fill(null);const seeds=teams.filter(t=>seedNames.includes(t.nome));const others=shuffle(teams.filter(t=>!seedNames.includes(t.nome)));seeds.forEach((t,i)=>{slots[slotByRank[i]]=t;});let oi=0;for(const s of slotByRank){if(slots[s]==null&&oi<others.length)slots[s]=others[oi++];}return{slots};}
function tieObj(a,b){return{id:uid(),a,b,ag1:null,bg1:null,ag2:null,bg2:null,apen:null,bpen:null,winner:null,info1:'',info2:'',scorers:[]};}
function makeBracketFromOrdered(ids){const size=nextPow2(ids.length);while(ids.length<size)ids.push(null);const rounds=[];let cur=[];for(let i=0;i<ids.length;i+=2)cur.push(tieObj(ids[i],ids[i+1]));rounds.push(cur);while(cur.length>1){const nx=[];for(let i=0;i<cur.length;i+=2)nx.push(tieObj(null,null));rounds.push(nx);cur=nx;}const br={rounds};if(size>=4&&(!state||state.cfg.terceiro!==false))br.third=tieObj(null,null);return br;}
function resolveTie(t,single){if(t.a==null&&t.b==null){t.winner=null;return;}if(t.a==null||t.b==null){t.winner=t.a||t.b;return;}let ag,bg;if(single){ag=t.ag1;bg=t.bg1;}else{ag=(t.ag1||0)+(t.ag2||0);bg=(t.bg1||0)+(t.bg2||0);}const filled=single?(t.ag1!=null&&t.bg1!=null):(t.ag1!=null&&t.bg1!=null&&t.ag2!=null&&t.bg2!=null);if(!filled){t.winner=null;return;}if(ag>bg)t.winner=t.a;else if(bg>ag)t.winner=t.b;else{if(t.apen!=null&&t.bpen!=null&&t.apen!==t.bpen)t.winner=t.apen>t.bpen?t.a:t.b;else t.winner=null;}}
function loserOf(t){if(t.winner==null)return null;return t.winner===t.a?t.b:t.a;}
function advanceBracket(d){const R=d.bracket.rounds,single=d.cfg.maoUnica;R.forEach(rd=>rd.forEach(t=>resolveTie(t,single)));for(let r=0;r<R.length-1;r++)R[r].forEach((t,i)=>{const tg=R[r+1][Math.floor(i/2)];tg[i%2===0?'a':'b']=t.winner;});
  if(d.bracket.third&&R.length>=2){const semis=R[R.length-2];if(semis.length===2){d.bracket.third.a=loserOf(semis[0]);d.bracket.third.b=loserOf(semis[1]);}}
  R.forEach(rd=>rd.forEach(t=>resolveTie(t,single)));if(d.bracket.third)resolveTie(d.bracket.third,single);}

/* ---------- ATLETAS / ELENCO ---------- */
function teamById(id){return state.teams.find(t=>t.id===id);}
function athleteById(aid){for(const t of state.teams){if(t.roster)for(const a of t.roster)if(a.id===aid)return{athlete:a,team:t};}return null;}
function athName(aid){const r=athleteById(aid);return r?r.athlete.nome:'—';}
function ageFrom(dob){if(!dob)return null;const d=new Date(dob);if(isNaN(d))return null;const n=new Date();let a=n.getFullYear()-d.getFullYear();const mm=n.getMonth()-d.getMonth();if(mm<0||(mm===0&&n.getDate()<d.getDate()))a--;return a;}
function compressPhoto(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const S=96,c=document.createElement('canvas');c.width=S;c.height=S;const ctx=c.getContext('2d');const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;ctx.drawImage(img,sx,sy,m,m,0,0,S,S);cb(c.toDataURL('image/jpeg',0.7));};img.onerror=()=>cb(null);img.src=fr.result;};fr.onerror=()=>cb(null);fr.readAsDataURL(file);}

/* ---------- EVENTOS (gols, cartões) ---------- */
/* cada partida/confronto guarda events:[{id,type:'goal'|'yellow'|'red',teamId,athleteId,leg}] */
function matchEvents(m){return m.events||[];}
function allMatchObjs(){const out=[];(state.matches||[]).forEach(m=>out.push({obj:m,kind:'match'}));if(state.bracket){state.bracket.rounds.forEach(rd=>rd.forEach(t=>out.push({obj:t,kind:'tie'})));if(state.bracket.third)out.push({obj:state.bracket.third,kind:'tie'});}return out;}
function migrateScorers(m){ // compat: converte scorers antigos em events de gol
  if(m.events)return;m.events=[];
  if(m.scorers&&m.scorers.length)m.scorers.forEach(s=>{for(let k=0;k<(+s.goals||0);k++)m.events.push({id:uid(),type:'goal',teamId:s.teamId,athleteId:s.athleteId||null,name:s.player||''});});
}
function ensureEvents(){allMatchObjs().forEach(x=>migrateScorers(x.obj));}
function scorerRanking(){const agg={};allMatchObjs().forEach(x=>{const m=x.obj;(m.events||[]).forEach(e=>{if(e.type!=='goal')return;const key=e.athleteId||('n:'+(e.name||'').toLowerCase()+'|'+(e.teamId||''));if(!agg[key])agg[key]={athleteId:e.athleteId,name:e.athleteId?athName(e.athleteId):(e.name||'—'),teamId:e.teamId,goals:0};agg[key].goals++;});});return Object.values(agg).sort((a,b)=>b.goals-a.goals);}
function cardRanking(){const agg={};allMatchObjs().forEach(x=>{(x.obj.events||[]).forEach(e=>{if(e.type!=='yellow'&&e.type!=='red')return;const key=e.athleteId||('n:'+(e.name||'').toLowerCase()+'|'+(e.teamId||''));if(!agg[key])agg[key]={athleteId:e.athleteId,name:e.athleteId?athName(e.athleteId):(e.name||'—'),teamId:e.teamId,y:0,r:0};if(e.type==='yellow')agg[key].y++;else agg[key].r++;});});return Object.values(agg).filter(r=>r.y||r.r).sort((a,b)=>(b.r*3+b.y)-(a.r*3+a.y));}
/* suspensão: vermelho => suspenso próx. jogo; a cada N amarelos => 1 jogo. Conta cartões "ativos" (não cumpridos) */
function suspensionInfo(athleteId){const lim=(state.cfg&&state.cfg.yellowLimit)||3;let y=0,r=0;allMatchObjs().forEach(x=>{(x.obj.events||[]).forEach(e=>{if(e.athleteId!==athleteId)return;if(e.type==='yellow')y++;else if(e.type==='red')r++;});});const pending=(r>0)||(lim>0&&y>0&&y%lim===0);return{y,r,suspended:pending,reason:r>0?'vermelho':(pending?lim+'º amarelo':'')};}

  sl.innerHTML=list.map(t=>{const f=FORMATS[t.formato]||{ic:'🏆',nome:t.formato};const d=new Date(t.updated).toLocaleDateString('pt-BR');
    return`<div class="saved"><h4>${esc(t.nome)}</h4><div class="meta">${f.ic} ${f.nome}</div><div class="meta">${t.status==='encerrado'?'✓ Encerrado':'● Ativo'} · Atualizado em ${d}</div>

      <button class="btn ghost sm danger" onclick="delT('${t.id}')">Excluir</button></div></div>`;}).join('');
}
