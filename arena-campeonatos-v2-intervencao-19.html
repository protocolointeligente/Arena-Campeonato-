function ensureBranding(){if(!state)return;state.branding=state.branding||{};if(!state.branding.accent)state.branding.accent='#2fcf6b';if(!Array.isArray(state.sponsors))state.sponsors=[];}
 function resetArenaTheme(){document.documentElement.style.setProperty('--grass','#2fcf6b');}
 function applyArenaTheme(){ensureBranding();document.documentElement.style.setProperty('--grass',state.branding.accent||'#2fcf6b');}
function readAndResizeImage(file,maxW,maxH,quality){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.size>8*1024*1024)return reject(new Error('Imagem maior que 8 MB'));const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,r=Math.min(1,maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality||.78));};im.onerror=()=>reject(new Error('Imagem inválida'));im.src=fr.result;};fr.onerror=()=>reject(fr.error);fr.readAsDataURL(file);});}
async function setBrandImage(kind,input){try{ensureBranding();const file=input.files&&input.files[0];if(!file)return;state.branding[kind]=await readAndResizeImage(file,kind==='cover'?1400:500,kind==='cover'?700:500,kind==='cover'?.72:.82);persist();renderManage();toast(kind==='cover'?'Capa atualizada':'Logo atualizada');}catch(e){toast(e.message||'Não foi possível processar a imagem');}}
function clearBrandImage(kind){ensureBranding();state.branding[kind]='';persist();renderManage();}
function setAccent(v){ensureBranding();state.branding.accent=v||'#2fcf6b';applyArenaTheme();persist();}
function brandingConfigHTML(){ensureBranding();const b=state.branding;return `<hr class="sep"><h4 style="font-size:18px;margin-bottom:12px">Identidade visual</h4><div class="brand-grid"><div><span class="dim">Logo do campeonato</span><div class="brand-preview" style="margin:7px 0">${b.logo?`<img class="brand-logo" src="${b.logo}">`:'<span class="dim">Sem logo</span>'}</div><div class="row"><label class="btn ghost sm">Selecionar logo<input type="file" accept="image/*" style="display:none" onchange="setBrandImage(\'logo\',this)"></label>${b.logo?'<button class="lnk danger" onclick="clearBrandImage(\'logo\')">Remover</button>':''}</div></div><div><span class="dim">Capa pública</span><div class="brand-preview cover" style="margin:7px 0;${b.cover?`background-image:url('${b.cover}')`:''}">${b.cover?'':'<span class="dim" style="position:relative;z-index:1">Sem capa</span>'}</div><div class="row"><label class="btn ghost sm">Selecionar capa<input type="file" accept="image/*" style="display:none" onchange="setBrandImage(\'cover\',this)"></label>${b.cover?'<button class="lnk danger" onclick="clearBrandImage(\'cover\')">Remover</button>':''}</div></div></div><label class="fld" style="margin-top:14px"><span>Cor principal do campeonato</span><div class="row"><input type="color" value="${esc(b.accent||'#2fcf6b')}" onchange="setAccent(this.value)" style="width:64px;height:42px;padding:3px"><span class="theme-dot" style="background:${esc(b.accent||'#2fcf6b')}"></span><code>${esc(b.accent||'#2fcf6b')}</code></div><div class="hint">Aplicada aos destaques do painel e do portal público.</div></label>${sponsorsConfigHTML()}`;}
function sponsorsConfigHTML(){ensureBranding();return `<hr class="sep"><h4 style="font-size:18px;margin-bottom:10px">Patrocinadores</h4><div class="sponsor-grid">${state.sponsors.map(s=>`<div class="sponsor-card">${s.logo?`<img class="sponsor-logo" src="${s.logo}">`:''}<b style="display:block;margin-top:6px">${esc(s.name)}</b>${s.url?`<span class="dim" style="font-size:11px">${esc(s.url)}</span>`:''}<div style="margin-top:7px"><button class="lnk danger" onclick="removeSponsor('${s.id}')">remover</button></div></div>`).join('')||'<p class="dim">Nenhum patrocinador cadastrado.</p>'}</div><div class="row" style="margin-top:12px"><input id="sp_name" placeholder="Nome do patrocinador" style="flex:1;min-width:180px"><input id="sp_url" placeholder="Site / Instagram (opcional)" style="flex:1;min-width:180px"><label class="btn ghost sm">Logo<input id="sp_logo" type="file" accept="image/*" style="display:none"></label><button class="btn primary sm" onclick="addSponsor()">+ Adicionar</button></div>`;}
async function addSponsor(){const n=$('#sp_name')&&$('#sp_name').value.trim();if(!n)return toast('Informe o nome do patrocinador');let logo='';try{const f=$('#sp_logo')&&$('#sp_logo').files[0];if(f)logo=await readAndResizeImage(f,360,180,.78);}catch(e){return toast(e.message)}state.sponsors.push({id:uid(),name:n,url:($('#sp_url')&&$('#sp_url').value.trim())||'',logo});persist();renderManage();toast('Patrocinador adicionado');}
function removeSponsor(id){state.sponsors=state.sponsors.filter(x=>x.id!==id);persist();renderManage();}
function publicBrandHero(){ensureBranding();const b=state.branding;if(!b.cover&&!b.logo)return'';return `<section class="public-cover" style="${b.cover?`background-image:url('${b.cover}')`:'background:linear-gradient(135deg,var(--panel2),var(--bg2))'}"><div class="public-cover-overlay">${b.logo?`<img class="public-brand-logo" src="${b.logo}">`:''}<div><div class="dim" style="text-transform:uppercase;font-size:11px;letter-spacing:1px">Campeonato</div><h2 style="font-size:27px">${esc(state.nome)}</h2>${state.subtitulo?`<div class="muted">${esc(state.subtitulo)}</div>`:''}</div></div></section>`;}
function publicSponsorsHTML(){ensureBranding();if(!state.sponsors.length)return'';return `<section class="card pad public-section"><h3 style="margin-bottom:12px">Patrocinadores</h3><div class="public-sponsors">${state.sponsors.map(s=>s.logo?`<img src="${s.logo}" title="${esc(s.name)}" alt="${esc(s.name)}">`:`<span class="tag">${esc(s.name)}</span>`).join('')}</div></section>`;}
function publicationCard(title,desc,link,qrid,copyfn){return `<div class="card pad"><h3>${title}</h3><p class="muted">${desc}</p><div class="qr-box"><canvas id="${qrid}"></canvas></div><div class="banner" style="margin:12px 0"><code style="word-break:break-all">${esc(link)}</code></div><div class="row"><button class="btn primary" onclick="${copyfn}">Copiar link</button><button class="btn ghost" onclick="downloadQR('${qrid}','${title.replace(/[^A-Za-z0-9]/g,'_')}')">Baixar QR</button></div></div>`;}
function viewPublicacao(){ensureBranding();const pub=shareLinkFor(state.id),reg=registrationLinkFor(state.id);return `<div class="dash-head"><div><h2>📣 Publicação</h2><p class="muted">Links e QR Codes prontos para divulgar o campeonato.</p></div></div><div class="pub-links">${publicationCard('Acompanhar campeonato','Resultados, tabela, jogos e estatísticas em tempo real.',pub,'qr_public',`copyShareId('${state.id}')`)}${publicationCard('Inscrever equipe','Formulário público de inscrição para equipes e atletas.',reg,'qr_registration',`copyRegistrationLink('${state.id}')`)}</div><div class="card pad" style="margin-top:14px"><h3>Identidade publicada</h3><p class="muted">A capa, logo, cor principal e patrocinadores configurados em Configurações são aplicados automaticamente ao portal público.</p><div class="row"><button class="btn ghost" onclick="setTab('config')">⚙️ Editar identidade</button><button class="btn primary" onclick="window.open('${pub}','_blank')">↗ Abrir portal público</button></div></div>`;}
function renderPublicationQRs(){if(typeof QRCode==='undefined')return;[['qr_public',shareLinkFor(state.id)],['qr_registration',registrationLinkFor(state.id)]].forEach(([id,url])=>{const c=document.getElementById(id);if(c)QRCode.toCanvas(c,url,{width:190,margin:1},()=>{});});}
function downloadQR(id,name){const c=document.getElementById(id);if(!c)return;const a=document.createElement('a');a.download=(name||'arena_qr')+'.png';a.href=c.toDataURL('image/png');a.click();}

/* ---------- SETUP (assistente) ---------- */
function renderSetup(){
  if(!setupDraft)setupDraft=newTournament('liga');state=null;renderHeaderActions();const d=setupDraft;
  $('#app').innerHTML=`<div style="max-width:780px;margin:0 auto">
    <button class="btn ghost sm" onclick="setupDraft=null;go('home')" style="margin:22px 0 4px">← Voltar</button>
    <h1 class="display" style="font-size:34px">NOVO CAMPEONATO</h1>
    <p class="muted" style="margin-bottom:24px">Escolha o formato, liste as equipes e siga para o sorteio.</p>
    <div class="card pad">
      <label class="fld"><span>Nome do campeonato</span><input type="text" id="s_nome" value="${esc(d.nome==='Novo Campeonato'?'':d.nome)}" placeholder="Ex.: Copa do Bairro 2026"></label>
      <span style="display:block;font-family:var(--cond);font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:8px;font-weight:600">Formato</span>
      <div class="fmt-grid" style="margin-bottom:22px">${Object.entries(FORMATS).map(([k,f])=>`<div class="fmt ${d.formato===k?'sel':''}" onclick="setFmt('${k}')"><div class="ic">${f.ic}</div><h3>${f.nome}</h3><p>${f.desc}</p></div>`).join('')}</div>
      <div id="fmtOpts"></div><hr class="sep">
      <label class="fld"><span>Equipes — uma por linha</span><textarea id="s_teams" oninput="refreshSeeds()" placeholder="Brasil&#10;Argentina&#10;Espanha&#10;Alemanha">${d.teams.map(t=>t.nome).join('\n')}</textarea>
        <div class="hint">Mínimo 2 equipes. No mata-mata, potências de 2 (4, 8, 16…) evitam folgas.</div></label>
      <div id="seedArea"></div>
      <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" onclick="prepareCreate()" style="padding:12px 28px" id="goBtn"></button></div>
    </div></div>`;
  renderFmtOpts();refreshSeeds();updateGoBtn();
}
function setFmt(k){saveDraftInputs();setupDraft.formato=k;if(k==='gxg')setupDraft.cfg.nGrupos=2;renderSetup();}
function updateGoBtn(){const b=$('#goBtn');if(b)b.textContent=setupDraft.formato==='liga'?'Gerar tabela →':'Ir para o sorteio →';}
function renderFmtOpts(){const d=setupDraft,el=$('#fmtOpts');if(d.formato==='liga')el.innerHTML=optTurnos(d)+optCrit(d);else if(d.formato==='grupos')el.innerHTML=`<div class="row"><label class="fld" style="flex:1;min-width:150px"><span>Nº de grupos</span><input type="number" id="s_ngrupos" min="1" value="${d.cfg.nGrupos}"></label><label class="fld" style="flex:1;min-width:150px"><span>Classificados / grupo</span><input type="number" id="s_classif" min="1" value="${d.cfg.classificam}"></label></div>`+optTurnos(d)+optCrit(d);else if(d.formato==='gxg')el.innerHTML=`<p class="hint" style="margin:-6px 0 14px">São criados <b>2 grupos (A e B)</b>. Cada equipe do A joga contra todas do B.</p>`+optTurnos(d)+optCrit(d);else el.innerHTML=`<label class="fld"><span>Formato dos confrontos</span><select id="s_mao"><option value="1" ${d.cfg.maoUnica?'selected':''}>Jogo único</option><option value="2" ${!d.cfg.maoUnica?'selected':''}>Ida e volta (placar agregado)</option></select></label>`;}
function optTurnos(d){return`<label class="fld"><span>Confrontos</span><select id="s_turnos"><option value="1" ${d.cfg.turnos==1?'selected':''}>Turno único</option><option value="2" ${d.cfg.turnos==2?'selected':''}>Ida e volta</option></select></label>`;}
function optCrit(d){const o=['P,V,SG,GP','P,V,GP,SG','P,SG,GP,V'],c=d.cfg.criterios.join(',');return`<label class="fld"><span>Critérios de desempate</span><select id="s_crit">${o.map(x=>`<option value="${x}" ${c===x?'selected':''}>${x.split(',').map(k=>CRIT_LABEL[k]).join(' › ')}</option>`).join('')}</select></label>`;}
function refreshSeeds(){saveDraftInputs();const d=setupDraft,area=$('#seedArea');if(!area)return;if(d.formato==='liga'||d.teams.length<2){area.innerHTML='';updateGoBtn();return;}const lbl=d.formato==='mata'?'Cabeças-de-chave (separadas no chaveamento)':'Cabeças-de-chave (uma por grupo)';area.innerHTML=`<label class="fld" style="margin-bottom:4px"><span>${lbl} — opcional</span></label><div class="seedpick">${d.teams.map(t=>`<button class="schip ${d.cfg.seedNames.includes(t.nome)?'on':''}" onclick="toggleSeed('${esc(t.nome).replace(/'/g,"\\'")}')">${esc(t.nome)}</button>`).join('')}</div><div class="hint">Selecionadas: ${d.cfg.seedNames.length}.</div>`;updateGoBtn();}
function toggleSeed(name){const s=setupDraft.cfg.seedNames,i=s.indexOf(name);if(i>=0)s.splice(i,1);else s.push(name);refreshSeeds();}
function saveDraftInputs(){const d=setupDraft,g=id=>{const e=document.getElementById(id);return e?e.value:null;};if(g('s_nome')!=null)d.nome=g('s_nome').trim()||'Novo Campeonato';if(g('s_teams')!=null)d.teams=g('s_teams').split('\n').map(x=>x.trim()).filter(Boolean).map(n=>({id:uid(),nome:n}));if(g('s_turnos'))d.cfg.turnos=+g('s_turnos');if(g('s_crit'))d.cfg.criterios=g('s_crit').split(',');if(g('s_ngrupos'))d.cfg.nGrupos=Math.max(1,+g('s_ngrupos'));if(g('s_classif'))d.cfg.classificam=Math.max(1,+g('s_classif'));if(g('s_mao'))d.cfg.maoUnica=g('s_mao')==='1';const names=d.teams.map(t=>t.nome);d.cfg.seedNames=d.cfg.seedNames.filter(n=>names.includes(n));}
function prepareCreate(){saveDraftInputs();const d=setupDraft;if(d.teams.length<2)return toast('Adicione pelo menos 2 equipes');const p=currentPlan();if(p.teamLimit!=null&&d.teams.length>p.teamLimit)return toast(freeTeamLimitMessage());if(d.formato==='liga')finalizeCreate(null);else go('draw');}

/* ---------- SORTEIO ---------- */
function renderDraw(){state=null;renderHeaderActions();const d=setupDraft;const seeds=d.teams.filter(t=>d.cfg.seedNames.includes(t.nome));const others=d.teams.filter(t=>!d.cfg.seedNames.includes(t.nome));let boxes='';if(d.formato==='mata'){const size=nextPow2(d.teams.length);boxes=`<div class="gbox"><h5>Chaveamento <span class="tag">${size} vagas</span></h5><div id="slotHost"></div></div>`;}else{const n=d.cfg.nGrupos;boxes=`<div class="gboxes">${Array.from({length:n},(_,i)=>`<div class="gbox"><h5>Grupo ${String.fromCharCode(65+i)}</h5><div id="gh${i}"></div></div>`).join('')}</div>`;}
  $('#app').innerHTML=`<div style="margin:22px 0 4px"><button class="btn ghost sm" onclick="go('setup')">← Editar equipes</button></div>
    <h1 class="display" style="font-size:34px">SORTEIO</h1><p class="muted" style="margin-bottom:20px">${esc(d.nome)} · ${FORMATS[d.formato].nome} · ${d.teams.length} equipes</p>
    <div class="draw-wrap"><div>${seeds.length?`<div class="pot"><h5>⭐ Cabeças-de-chave</h5>${seeds.map(t=>`<div class="pchip seed" data-nm="${esc(t.nome)}"><span class="dot"></span>${esc(t.nome)}</div>`).join('')}</div>`:''}
      <div class="pot"><h5>Equipes</h5>${others.map(t=>`<div class="pchip" data-nm="${esc(t.nome)}"><span class="dot"></span>${esc(t.nome)}</div>`).join('')}</div>
      <div class="row" style="margin-top:6px"><button class="btn primary" id="drawBtn" onclick="runDraw()">🎲 Sortear</button><button class="btn gold" id="confBtn" onclick="confirmDraw()" disabled>✓ Confirmar e criar</button></div></div>
      <div>${boxes}</div></div>`;
  drawResult=null;
}
function runDraw(){const d=setupDraft;$('#drawBtn').disabled=true;$('#confBtn').disabled=true;if(d.formato==='mata'){drawResult=drawBracket(d.teams,d.cfg.seedNames);const host=$('#slotHost');host.innerHTML='';const slots=drawResult.slots;slots.forEach((t,i)=>{const el=document.createElement('div');el.className='slot'+(t&&isSeedName(t.nome)?' seed':'');el.id='sl'+i;el.innerHTML=t?`<span class="dot" style="width:7px;height:7px;border-radius:50%;background:${t&&isSeedName(t.nome)?'var(--gold)':'var(--grass)'}"></span>${esc(t.nome)}`:'<span class="dim">— folga —</span>';host.appendChild(el);});let i=0;const step=()=>{if(i>=slots.length){finishDraw();return;}const el=$('#sl'+i);if(el)el.classList.add('in');mark(slots[i]);i++;setTimeout(step,260);};step();}else{const n=d.cfg.nGrupos;for(let i=0;i<n;i++)$('#gh'+i).innerHTML='';drawResult=drawGroups(d.teams,n,d.cfg.seedNames);const seq=drawResult.seq;let i=0;const step=()=>{if(i>=seq.length){finishDraw();return;}const{gi,team,seed}=seq[i];const el=document.createElement('div');el.className='slot'+(seed?' seed':'');el.innerHTML=`<span class="dot" style="width:7px;height:7px;border-radius:50%;background:${seed?'var(--gold)':'var(--grass)'}"></span>${esc(team.nome)}`;$('#gh'+gi).appendChild(el);requestAnimationFrame(()=>el.classList.add('in'));mark(team);i++;setTimeout(step,240);};step();}}
function isSeedName(n){return setupDraft.cfg.seedNames.includes(n);}
function mark(team){if(!team)return;const c=document.querySelector(`.pchip[data-nm="${(window.CSS&&CSS.escape)?CSS.escape(team.nome):team.nome}"]`);if(c)c.classList.add('taken');}
function finishDraw(){$('#drawBtn').disabled=false;$('#drawBtn').textContent='🎲 Sortear novamente';$('#confBtn').disabled=false;}
function confirmDraw(){const d=setupDraft;if(d.formato==='mata')finalizeCreate({slots:drawResult.slots});else finalizeCreate({groups:drawResult.groups});}

async function finalizeCreate(assign){
  const d=setupDraft;
  if(d.formato==='liga')d.matches=buildFixtures(d.teams.map((_,i)=>i),d.cfg.turnos);
  else if(d.formato==='grupos'){d.grupos=assign.groups.map(g=>g.map(t=>t.id));d.matches=[];d.grupos.forEach((g,gi)=>{const idxs=g.map(id=>d.teams.findIndex(t=>t.id===id));buildFixtures(idxs,d.cfg.turnos).forEach(m=>{m.grupo=gi;d.matches.push(m);});});}
  else if(d.formato==='gxg'){d.grupos=assign.groups.map(g=>g.map(t=>t.id));buildGxg(d);}
  else{const ids=assign.slots.map(t=>t?t.id:null);d.bracket=makeBracketFromOrdered(ids);}
  ensureCategories(d);saveRootIntoActive();$('#app').innerHTML=loadingHTML('Salvando na nuvem...');
  try{await Store.create(d);}catch(e){toast('Erro ao criar: '+(e.message||e));return go('setup');}
  state=d;setupDraft=null;drawResult=null;currentTab='overview';go('manage');toast('Campeonato criado!');
}

function adminNavItems(){

function teamLogoMini(idx){const t=state.teams[idx];if(t&&t.logo)return`<img class="miniphoto" style="border-radius:5px" src="${t.logo}">`;return'';}
function standingsTable(st,q1,q2){const sd=!!(state&&state.cfg.criterios&&state.cfg.criterios.includes('DISC'));return`<div class="card pad" style="overflow-x:auto"><table class="tabela"><thead><tr><th>#</th><th class="l">Classificação</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>%</th>${sd?'<th title="Pontos de disciplina (fair-play)">DISC</th>':''}</tr></thead><tbody>${st.map((s,i)=>{let cl=q1&&i<q1?'qz':(q2&&i<q1+q2?'qz2':'');return`<tr class="${cl}"><td class="pos">${i+1}</td><td class="team">${teamLogoMini(s.team)}${isSeed(state.teams[s.team].nome)?'<span class="seedstar">★</span> ':''}${tname(s.team)}</td><td class="pts">${s.P}</td><td>${s.J}</td><td>${s.V}</td><td>${s.E}</td><td>${s.D}</td><td>${s.GP}</td><td>${s.GC}</td><td>${s.SG>0?'+':''}${s.SG}</td><td>${s.pct.toFixed(1)}</td>${sd?`<td style="color:${s.DISC<0?'var(--bad)':'var(--muted)'}">${s.DISC}</td>`:''}</tr>`;}).join('')}</tbody></table></div>`;}
function progressBar(){const ms=state.matches||[];if(!ms.length)return'';const done=ms.filter(m=>m.hg!=null&&m.ag!=null).length;const pct=Math.round(done/ms.length*100);return`<div class="card pad" style="margin-bottom:14px;padding:14px 18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><span style="font-family:var(--cond);text-transform:uppercase;letter-spacing:1px;font-size:13px;color:var(--muted);font-weight:600">Progresso do campeonato</span><span style="font-weight:700;color:var(--grass)">${done}/${ms.length} jogos · ${pct}%</span></div><div style="height:8px;background:var(--bg2);border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--grass-d),var(--grass));border-radius:99px;transition:.4s"></div></div></div>`;}
function nextMatchesCard(){const ms=(state.matches||[]).filter(m=>m.hg==null||m.ag==null).slice(0,5);if(!ms.length)return'';const suspSet=new Set();state.teams.forEach(t=>(t.roster||[]).forEach(a=>{if(suspensionInfo(a.id).suspended)suspSet.add(t.id);}));return`<div class="card pad" style="margin-bottom:14px"><h3 style="font-size:17px;margin-bottom:10px">📅 Próximos jogos</h3>${ms.map(m=>{const ht=state.teams[m.home],at=state.teams[m.away];const flag=(t)=>suspSet.has(t.id)?' <span class="susp" style="font-size:9px">tem suspenso</span>':'';return`<div class="evrow"><span class="who">${esc(ht.nome)}${flag(ht)} <span class="tm">×</span> ${esc(at.nome)}${flag(at)}</span><span class="tm">${m.info?esc(m.info):(m.rodada+'ª rod.')}</span></div>`;}).join('')}</div>`;}
function viewClassif(){const d=state;const extra=(d.formato!=='gxg')?(progressBar()+nextMatchesCard()):'';if(d.formato==='grupos')return extra+d.grupos.map((g,gi)=>{const idxs=g.map(id=>d.teams.findIndex(t=>t.id===id));const st=computeStandings(idxs,d.matches.filter(m=>m.grupo===gi));return`<div class="grp-title">Grupo ${String.fromCharCode(65+gi)} <span class="ln"></span></div>`+standingsTable(st,d.cfg.classificam,0);}).join('');if(d.formato==='gxg'){const A=d.grupos[0].map(id=>d.teams.findIndex(t=>t.id===id));const B=d.grupos[1].map(id=>d.teams.findIndex(t=>t.id===id));const stA=computeStandings(A,d.matches),stB=computeStandings(B,d.matches);const pA=stA.reduce((s,x)=>s+x.P,0),pB=stB.reduce((s,x)=>s+x.P,0);const head=`<div class="gscore"><div class="gb ${pA>=pB?'lead':''}"><b>${pA}</b>Grupo A</div><span class="vs">×</span><div class="gb ${pB>pA?'lead':''}"><b>${pB}</b>Grupo B</div></div><p class="center muted" style="margin-top:-8px;font-size:13px">Pontos somados nos confrontos interzonas</p>`;return progressBar()+head+`<div class="grp-title">Grupo A <span class="ln"></span></div>`+standingsTable(stA,0,0)+`<div class="grp-title">Grupo B <span class="ln"></span></div>`+standingsTable(stB,0,0);}const st=computeStandings(d.teams.map((_,i)=>i),d.matches);return extra+`<p class="muted no-print" style="margin:0 0 12px;font-size:13px">Desempate: ${d.cfg.criterios.map(c=>CRIT_LABEL[c]).join(' › ')}${d.cfg.confrontoDireto!==false?' › Confronto direto':''}</p>`+standingsTable(st,0,0);}

function ensureOps(){state.venues=Array.isArray(state.venues)?state.venues:[];state.officials=Array.isArray(state.officials)?state.officials:[];}
function venueById(id){ensureOps();return state.venues.find(v=>v.id===id)||null;}
function officialById(id){ensureOps();return state.officials.find(o=>o.id===id)||null;}
function matchMeta(m){m.meta=m.meta||{};if(m.info&&!m.meta._migrated){const z=splitInfo(m.info);m.meta.date=m.meta.date||z.data;m.meta.time=m.meta.time||z.hora;m.meta.venueText=m.meta.venueText||z.local;m.meta._migrated=true;}return m.meta;}
function fmtDateBR(v){if(!v)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const[a,b,c]=v.split('-');return c+'/'+b+'/'+a;}return v;}
function metaLine(m){const x=matchMeta(m),v=venueById(x.venueId),o=officialById(x.refereeId);return [fmtDateBR(x.date),x.time,(v&&v.name)||x.venueText,(o&&('Árbitro: '+o.name))].filter(Boolean).join(' · ');}
function openMatchOps(id){if(RO)return;if(!can('results'))return permissionDenied();const m=state.matches.find(x=>x.id===id);if(!m)return;ensureOps();const x=matchMeta(m);$('#modalBox').innerHTML=`<h3>⚽ Operação da partida</h3><p class="muted">${esc(tname(m.home))} × ${esc(tname(m.away))}</p><div class="sumula-head"><label class="fld"><span>Data</span><input id="op_date" type="date" value="${esc(x.date||'')}"></label><label class="fld"><span>Horário</span><input id="op_time" type="time" value="${esc(x.time||'')}"></label><label class="fld"><span>Local</span><select id="op_venue"><option value="">— Selecionar —</option>${state.venues.map(v=>`<option value="${v.id}" ${x.venueId===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label><label class="fld"><span>Árbitro</span><select id="op_ref"><option value="">— Selecionar —</option>${state.officials.map(o=>`<option value="${o.id}" ${x.refereeId===o.id?'selected':''}>${esc(o.name)}${o.role?' · '+esc(o.role):''}</option>`).join('')}</select></label><label class="fld"><span>Mesário / auxiliar</span><select id="op_table"><option value="">— Selecionar —</option>${state.officials.map(o=>`<option value="${o.id}" ${x.tableOfficialId===o.id?'selected':''}>${esc(o.name)}${o.role?' · '+esc(o.role):''}</option>`).join('')}</select></label><label class="fld"><span>Status</span><select id="op_status">${[['scheduled','Agendada'],['live','Em andamento'],['finished','Encerrada'],['postponed','Adiada'],['cancelled','Cancelada']].map(([k,l])=>`<option value="${k}" ${(x.status||'scheduled')===k?'selected':''}>${l}</option>`).join('')}</select></label></div><label class="fld"><span>Observações</span><textarea id="op_notes" style="min-height:80px">${esc(x.notes||'')}</textarea></label><div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveMatchOps('${id}')">Salvar partida</button></div>`;$('#modalBg').classList.add('open');}
function saveMatchOps(id){if(!can('results'))return permissionDenied();const m=state.matches.find(x=>x.id===id);if(!m)return;const x=matchMeta(m),before=deep(x);x.date=$('#op_date').value;x.time=$('#op_time').value;x.venueId=$('#op_venue').value;x.refereeId=$('#op_ref').value;x.tableOfficialId=$('#op_table').value;x.status=$('#op_status').value;x.notes=$('#op_notes').value;m.info=metaLine(m);audit('match_update',`Dados da partida alterados: ${tname(m.home)} × ${tname(m.away)}`,'match',m.id,before,deep(x));persist();closeModal();renderManage();toast('Partida atualizada');}
function opsConfigHTML(){ensureOps();return `<hr class="sep"><h4 style="font-size:18px;margin-bottom:12px">Locais & arbitragem</h4><div class="ops-grid"><div class="ops-card"><h5>📍 Locais</h5>${state.venues.map(v=>`<div class="row" style="align-items:center;margin-bottom:6px"><div style="flex:1"><b>${esc(v.name)}</b>${v.address?`<div class="hint">${esc(v.address)}</div>`:''}</div><button class="lnk danger" onclick="delVenue('${v.id}')">Excluir</button></div>`).join('')||'<p class="dim">Nenhum local cadastrado.</p>'}<input id="newVenueName" type="text" placeholder="Nome do local"><input id="newVenueAddr" type="text" placeholder="Endereço / observação" style="margin-top:6px"><button class="btn ghost sm" style="margin-top:7px" onclick="addVenue()">+ Adicionar local</button></div><div class="ops-card"><h5>🧑‍⚖️ Arbitragem / oficiais</h5>${state.officials.map(o=>`<div class="row" style="align-items:center;margin-bottom:6px"><div style="flex:1"><b>${esc(o.name)}</b><div class="hint">${esc(o.role||'Oficial')}${o.phone?' · '+esc(o.phone):''}</div></div><button class="lnk danger" onclick="delOfficial('${o.id}')">Excluir</button></div>`).join('')||'<p class="dim">Nenhum oficial cadastrado.</p>'}<input id="newOfficialName" type="text" placeholder="Nome"><div class="row" style="margin-top:6px"><input id="newOfficialRole" type="text" placeholder="Função: árbitro, mesário..." style="flex:1"><input id="newOfficialPhone" type="text" placeholder="Telefone" style="flex:1"></div><button class="btn ghost sm" style="margin-top:7px" onclick="addOfficial()">+ Adicionar oficial</button></div></div>`;}
function addVenue(){ensureOps();const n=$('#newVenueName').value.trim();if(!n)return toast('Informe o nome do local');state.venues.push({id:uid(),name:n,address:$('#newVenueAddr').value.trim()});persist();renderManage();}
function delVenue(id){ensureOps();state.venues=state.venues.filter(v=>v.id!==id);persist();renderManage();}
function addOfficial(){ensureOps();const n=$('#newOfficialName').value.trim();if(!n)return toast('Informe o nome do oficial');state.officials.push({id:uid(),name:n,role:$('#newOfficialRole').value.trim(),phone:$('#newOfficialPhone').value.trim()});persist();renderManage();}
function delOfficial(id){ensureOps();state.officials=state.officials.filter(o=>o.id!==id);persist();renderManage();}
function viewJogos(){const d=state;let groups;if(d.formato==='grupos')groups=d.grupos.map((_,gi)=>({label:'Grupo '+String.fromCharCode(65+gi),ms:d.matches.filter(m=>m.grupo===gi)}));else if(d.formato==='gxg')groups=[{label:'Confrontos interzonas (A × B)',ms:d.matches}];else groups=[{label:null,ms:d.matches}];return groups.map(grp=>{const byR={};grp.ms.forEach(m=>{(byR[m.rodada]=byR[m.rodada]||[]).push(m);});const head=grp.label?`<div class="grp-title">${grp.label} <span class="ln"></span></div>`:'';return head+Object.keys(byR).sort((a,b)=>a-b).map(r=>`<div class="rodada"><h4><span class="num">${r}ª</span> Rodada</h4>${byR[r].map(matchRow).join('')}</div>`).join('');}).join('');}
function matchRow(m){const done=m.hg!=null&&m.ag!=null,hw=done&&m.hg>m.ag,aw=done&&m.ag>m.hg,x=matchMeta(m),ml=metaLine(m);const st=x.status==='live'?'<span class="tag live">AO VIVO</span>':(x.status==='postponed'?'<span class="tag gold">ADIADA</span>':(x.status==='cancelled'?'<span class="tag">CANCELADA</span>':''));
  if(RO)return`<div class="match ${done?'done':''}"><div class="home ${hw?'w':''}">${tname(m.home)}</div><div class="sc"><b class="${hw?'w':''}">${m.hg??'–'}</b><span class="x">×</span><b class="${aw?'w':''}">${m.ag??'–'}</b></div><div class="away ${aw?'w':''}">${tname(m.away)}</div>${ml||st?`<div class="match-meta">${st}<span>${esc(ml)}</span></div>`:''}</div>`;
  const ng=(m.events||[]).filter(e=>e.type==='goal').length;
  return`<div class="match ${done?'done':''}"><div class="home ${hw?'w':''}">${tname(m.home)}</div><div class="sc"><input type="number" min="0" value="${m.hg??''}" onchange="setScore('${m.id}','hg',this.value)"><span class="x">×</span><input type="number" min="0" value="${m.ag??''}" onchange="setScore('${m.id}','ag',this.value)"></div><div class="away ${aw?'w':''}">${tname(m.away)}</div>${ml||st?`<div class="match-meta">${st}<span>${esc(ml)}</span></div>`:''}<div class="match-actions no-print"><button class="lnk" onclick="openMatchOps('${m.id}')">🗓️ Dados da partida</button><button class="lnk" onclick="sumulaModal('match','${m.id}')">📋 Súmula digital${ng?' ('+ng+'⚽)':''}</button><button class="lnk" onclick="printSumula('match','${m.id}')">🖨️ Imprimir</button></div></div>`;}
function setScore(id,f,v){if(RO||!can('results'))return permissionDenied();const m=state.matches.find(x=>x.id===id);if(m){const before={hg:m.hg,ag:m.ag};m[f]=num(v);const after={hg:m.hg,ag:m.ag};audit('score_update',`Placar alterado: ${tname(m.home)} ${after.hg??'–'} × ${after.ag??'–'} ${tname(m.away)}`,'match',m.id,before,after);persist();}}
function setInfo(id,v){if(RO)return;const m=state.matches.find(x=>x.id===id);if(m){m.info=v;persist();}}

/* BRACKET */
function renderBracketView(c){const d=state;advanceBracket(d);if(!RO)persist();const R=d.bracket.rounds,finalTie=R[R.length-1][0],champ=finalTie.winner,vice=champ!=null?(champ===finalTie.a?finalTie.b:finalTie.a):null;let h=`<div class="bracket">`;R.forEach(rd=>{const size=rd.length*2;h+=`<div class="bcol"><h5>${ROUND_NAMES[size]||(size+'-avos')}</h5>`+rd.map(t=>tieHTML(t,d.cfg.maoUnica)).join('')+`</div>`;});
  let podium=`<div class="bcol"><h5>Pódio</h5><div class="champ"><div class="cup">🏆</div><div class="nm">${champ!=null?teamNameById(champ):'—'}</div>${vice!=null?`<div style="margin-top:8px;font-size:13px;color:var(--muted)">🥈 ${teamNameById(vice)}</div>`:''}${d.bracket.third&&d.bracket.third.winner!=null?`<div style="margin-top:4px;font-size:13px;color:#cd7f32">🥉 ${teamNameById(d.bracket.third.winner)}</div>`:''}</div></div>`;
  let thirdCol='';if(d.bracket.third&&(d.bracket.third.a!=null||d.bracket.third.b!=null)){thirdCol=`<div class="bcol"><h5>Disputa 3º lugar</h5>${tieHTML(d.bracket.third,d.cfg.maoUnica)}</div>`;}
  h+=thirdCol+podium+`</div>`;c.innerHTML=h;}
function findTie(id){for(const rd of state.bracket.rounds){const t=rd.find(x=>x.id===id);if(t)return t;}if(state.bracket.third&&state.bracket.third.id===id)return state.bracket.third;}
function tieHTML(t,single){const wA=t.winner&&t.winner===t.a,wB=t.winner&&t.winner===t.b;const f=v=>v==null?'–':v;const seedMark=id=>{const i=state.teams.findIndex(x=>x.id===id);return i>=0&&isSeed(state.teams[i].nome)?'<span class="seedstar">★</span>':'';};
  if(RO){const ra=single?f(t.ag1):`${f(t.ag1)}+${f(t.ag2)}`,rb=single?f(t.bg1):`${f(t.bg1)}+${f(t.bg2)}`;const pen=(t.apen!=null&&t.bpen!=null)?`<div class="pen">Pênaltis ${t.apen} × ${t.bpen}</div>`:'';const info=[t.info1,t.info2].filter(Boolean).map(x=>`<div class="tinfo"><span class="muted">${esc(x)}</span></div>`).join('');return`<div class="tie"><div class="side ${wA?'win':''}"><span class="nm">${seedMark(t.a)}${teamNameById(t.a)}</span><span class="agg"><b>${ra}</b></span></div><div class="side ${wB?'win':''}"><span class="nm">${seedMark(t.b)}${teamNameById(t.b)}</span><span class="agg"><b>${rb}</b></span></div>${pen}${info}</div>`;}
  const dis=s=>t[s]==null?'disabled':'',fe=v=>v==null?'':v;
  const inA=single?`<input type="number" min="0" value="${fe(t.ag1)}" ${dis('a')} onchange="setTie('${t.id}','ag1',this.value)">`:`<input type="number" min="0" value="${fe(t.ag1)}" ${dis('a')} onchange="setTie('${t.id}','ag1',this.value)" title="ida"><input type="number" min="0" value="${fe(t.ag2)}" ${dis('a')} onchange="setTie('${t.id}','ag2',this.value)" title="volta">`;
  const inB=single?`<input type="number" min="0" value="${fe(t.bg1)}" ${dis('b')} onchange="setTie('${t.id}','bg1',this.value)">`:`<input type="number" min="0" value="${fe(t.bg1)}" ${dis('b')} onchange="setTie('${t.id}','bg1',this.value)" title="ida"><input type="number" min="0" value="${fe(t.bg2)}" ${dis('b')} onchange="setTie('${t.id}','bg2',this.value)" title="volta">`;
  const ag=single?t.ag1:(t.ag1||0)+(t.ag2||0),bg=single?t.bg1:(t.bg1||0)+(t.bg2||0);const filled=single?(t.ag1!=null&&t.bg1!=null):(t.ag1!=null&&t.bg1!=null&&t.ag2!=null&&t.bg2!=null);
  const pen=(t.winner==null&&filled&&ag===bg&&t.a!=null&&t.b!=null)?`<div class="pen">Pênaltis: <input type="number" min="0" style="width:32px" value="${fe(t.apen)}" onchange="setTie('${t.id}','apen',this.value)"> × <input type="number" min="0" style="width:32px" value="${fe(t.bpen)}" onchange="setTie('${t.id}','bpen',this.value)"></div>`:'';
  const ng=(t.events||[]).filter(e=>e.type==='goal').length;
  const info=(t.a!=null&&t.b!=null)?`<div class="tinfo no-print"><input type="text" placeholder="${single?'Data · Hora · Local':'Ida: data/local'}" value="${esc(t.info1||'')}" onchange="setTie('${t.id}','info1',this.value)">${!single?`<input type="text" placeholder="Volta: data/local" style="margin-top:5px" value="${esc(t.info2||'')}" onchange="setTie('${t.id}','info2',this.value)">`:''}<button class="lnk" onclick="printSumula('tie','${t.id}')">🖨️ Súmula p/ imprimir</button><button class="lnk" onclick="sumulaModal('tie','${t.id}')">📋 Súmula${ng?' ('+ng+'⚽)':''}</button></div>`:'';
  return`<div class="tie"><div class="side ${wA?'win':''}"><span class="nm">${seedMark(t.a)}${teamNameById(t.a)}</span><span class="agg">${inA}</span></div><div class="side ${wB?'win':''}"><span class="nm">${seedMark(t.b)}${teamNameById(t.b)}</span><span class="agg">${inB}</span></div>${pen}${info}</div>`;}
function setTie(id,f,v){if(RO)return;const t=findTie(id);if(!t)return;t[f]=(f==='info1'||f==='info2')?v:num(v);advanceBracket(state);persist();if(f==='info1'||f==='info2')return;renderBracketView($('#tabContent'));}
function renderMataFromGroups(c){const d=state;if(!d.bracket){if(RO){c.innerHTML=`<div class="empty card pad"><div class="ic">⏳</div><p>O mata-mata ainda não foi gerado pelo organizador.</p></div>`;return;}c.innerHTML=`<div class="card pad center"><p class="muted" style="margin-bottom:14px">Gere o mata-mata cruzando os classificados (${d.cfg.classificam}º de cada grupo · 1º × 2º).</p><button class="btn primary" onclick="genCross()">⚔️ Gerar mata-mata</button></div>`;return;}if(!RO)c.innerHTML=`<div class="row no-print" style="justify-content:flex-end;margin-bottom:8px"><button class="btn ghost sm danger" onclick="state.bracket=null;persist();renderManage()">↺ Regerar</button></div>`;else c.innerHTML='';const tmp=document.createElement('div');renderBracketView(tmp);c.insertAdjacentHTML('beforeend',tmp.innerHTML);}
function genCross(){const d=state,byPos=[];d.grupos.forEach((g,gi)=>{const idxs=g.map(id=>d.teams.findIndex(t=>t.id===id));const st=computeStandings(idxs,d.matches.filter(m=>m.grupo===gi));for(let p=0;p<d.cfg.classificam;p++)(byPos[p]=byPos[p]||[]).push(st[p]?d.teams[st[p].team].id:null);});let seedList=[];const W=byPos[0]||[],Rn=byPos[1]||[];if(d.cfg.classificam>=2&&W.length===Rn.length&&W.length>1){for(let i=0;i<W.length;i++){const j=i%2===0?i+1:i-1;seedList.push(W[i]);seedList.push(Rn[j]!=null?Rn[j]:Rn[i]);}}else byPos.forEach(arr=>arr.forEach(id=>seedList.push(id)));d.bracket=makeBracketFromOrdered(seedList);advanceBracket(d);persist();renderManage();}

/* ARTILHARIA */
function viewArtilheiros(){const rows=scorerRanking();if(!rows.length)return`<div class="empty card pad"><div class="ic">⚽</div><p>Nenhum gol registrado ainda.${RO?'':'<br>Use o botão <b>📋 Súmula</b> em cada jogo.'}</p></div>`;return`<div class="card pad" style="overflow-x:auto"><table class="tabela"><thead><tr><th>#</th><th class="l">Atleta</th><th class="l">Equipe</th><th>Gols</th></tr></thead><tbody>${rows.map((r,i)=>{const ph=r.athleteId?(athleteById(r.athleteId)||{}).athlete:null;return`<tr><td class="pos">${i+1}</td><td class="team">${ph&&ph.foto?`<img class="miniphoto" src="${ph.foto}">`:''}${esc(r.name)}</td><td class="l">${r.teamId?teamNameById(r.teamId):'—'}</td><td class="pts">${r.goals}</td></tr>`;}).join('')}</tbody></table></div>`;}

function viewDisciplina(){
  const rows=cardRanking();
  const lim=(state.cfg&&state.cfg.yellowLimit)||3;
  let susp=[];state.teams.forEach(t=>(t.roster||[]).forEach(a=>{const s=suspensionInfo(a.id);if(s.suspended)susp.push({a,t,s});}));
  const suspHTML=susp.length?`<div class="card pad" style="margin-bottom:14px;border-color:var(--bad)"><h3 style="font-size:18px;margin-bottom:10px;color:var(--bad)">⛔ Suspensos para o próximo jogo</h3>${susp.map(x=>`<div class="evrow"><span class="who">${x.a.foto?`<img class="miniphoto" src="${x.a.foto}">`:''}<b>${esc(x.a.nome)}</b> <span class="tm">— ${esc(x.t.nome)}</span></span><span class="susp">${x.s.reason}</span></div>`).join('')}</div>`:'';
  const tbl=rows.length?`<div class="card pad" style="overflow-x:auto"><table class="tabela"><thead><tr><th>#</th><th class="l">Atleta</th><th class="l">Equipe</th><th>🟨</th><th>🟥</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="pos">${i+1}</td><td class="team">${esc(r.name)}</td><td class="l">${r.teamId?teamNameById(r.teamId):'—'}</td><td>${r.y||''}</td><td>${r.r||''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty card pad"><div class="ic">🟨</div><p>Nenhum cartão registrado.</p></div>`;
  return `<p class="muted no-print" style="margin:0 0 12px;font-size:13px">Regra de suspensão: cartão vermelho ou ${lim} amarelos = 1 jogo de suspensão.</p>`+suspHTML+tbl;
}

function viewElenco(){
  const d=state;
  return d.teams.map(t=>{
    const ros=t.roster||[];
    const crest=t.logo?`<img class="crest" src="${t.logo}">`:`<div class="crest">${esc((t.nome||'?').slice(0,2).toUpperCase())}</div>`;
    const rows=ros.map(a=>{
      const s=suspensionInfo(a.id);const age=ageFrom(a.dob);
      const ph=a.foto?`<img class="ph" src="${a.foto}">`:`<div class="ph">${esc((a.nome||'?').slice(0,1).toUpperCase())}</div>`;
      const goals=scorerRanking().find(r=>r.athleteId===a.id);
      return `<div class="ath">${ph}<div class="info"><b>${esc(a.nome)}</b><span>${a.numero?'#'+esc(a.numero)+' · ':''}${age!=null?age+' anos':(a.dob?esc(a.dob):'sem data')}</span></div>
        <div class="stats"><span class="st" title="gols">⚽ ${goals?goals.goals:0}</span><span class="st" title="amarelos"><span class="cardico y"></span>${s.y}</span><span class="st" title="vermelhos"><span class="cardico r"></span>${s.r}</span>${s.suspended?'<span class="susp">SUSP</span>':''}${RO?'':`<button class="lnk" onclick="editAthlete('${t.id}','${a.id}')">editar</button>`}</div></div>`;
    }).join('')||'<p class="dim" style="padding:8px 0">Nenhum atleta cadastrado.</p>';
    const adder=RO?'':`<div class="addath"><input type="text" id="na_${t.id}" placeholder="Nome completo do atleta"><input type="text" id="nd_${t.id}" placeholder="Nascimento (DD/MM/AAAA)"><input type="number" id="nn_${t.id}" placeholder="Nº"></div>
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="addAthlete('${t.id}')">+ Adicionar atleta</button><button class="btn ghost sm" onclick="pickLogo('${t.id}')">🛡️ Logo do time</button></div>`;
    const staff=t.staff||{};
    const staffHTML=`<div class="staffbox"><div class="staff-h">Comissão técnica</div>${RO?(Object.values(staff).some(Boolean)?'':'<span class="dim" style="font-size:13px">Não informada.</span>'):''}
      <div class="staff-grid">
        ${staffRow(t.id,'tecnico','Técnico',staff.tecnico)}
        ${staffRow(t.id,'auxiliar','Auxiliar técnico',staff.auxiliar)}
        ${staffRow(t.id,'preparador','Preparador físico',staff.preparador)}
        ${staffRow(t.id,'medico','Médico / Fisioterapeuta',staff.medico)}
      </div></div>`;
    return `<details class="team-acc"><summary>${crest}${esc(t.nome)}<span class="cnt">${ros.length} atleta(s)</span></summary><div class="team-body">${rows}${adder}${staffHTML}</div></details>`;
  }).join('');
}
function addAthlete(tid){const t=teamById(tid);if(!t)return;t.roster=t.roster||[];const nome=($('#na_'+tid).value||'').trim();if(!nome)return toast('Informe o nome');const dob=($('#nd_'+tid).value||'').trim();const numero=($('#nn_'+tid).value||'').trim();t.roster.push({id:uid(),nome,dob,numero,foto:''});persist();renderManage();toast('Atleta adicionado');}
function editAthlete(tid,aid){const t=teamById(tid);const a=(t.roster||[]).find(x=>x.id===aid);if(!a)return;window._ea={tid,aid};
  modal(`<h3>Editar atleta</h3>
    <div class="phpick"><div class="prev" id="eaPrev">${a.foto?`<img src="${a.foto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:'👤'}</div><div><button class="btn ghost sm" onclick="eaPhoto()">📷 Escolher foto</button><div class="hint">A imagem é reduzida automaticamente.</div></div></div>
    <label class="fld"><span>Nome completo</span><input type="text" id="ea_nome" value="${esc(a.nome)}"></label>
    <div class="row"><label class="fld" style="flex:1"><span>Nascimento</span><input type="text" id="ea_dob" value="${esc(a.dob||'')}" placeholder="DD/MM/AAAA"></label><label class="fld" style="width:90px"><span>Número</span><input type="number" id="ea_num" value="${esc(a.numero||'')}"></label></div>
    <div class="row" style="justify-content:space-between;margin-top:6px"><button class="btn ghost sm danger" onclick="delAthlete()">🗑 Remover</button><button class="btn primary" onclick="saveAthlete()">Salvar</button></div>`);
}

function sumulaModal(kind,id){if(RO)return;let obj,sides;if(kind==='match'){obj=state.matches.find(x=>x.id===id);sides=[obj.home,obj.away].map(i=>state.teams[i]);}else{obj=findTie(id);if(!obj)return;sides=[obj.a,obj.b].map(tid=>teamById(tid)).filter(Boolean);}obj.events=obj.events||[];window._su={kind,id,sides:sides.map(t=>t.id)};renderSumula();$('#modalBg').classList.add('open');}
function renderSumula(){const{kind,id,sides}=window._su;const obj=kind==='match'?state.matches.find(x=>x.id===id):findTie(id);
  const evs=obj.events||[];
  const evHTML=evs.map((e,i)=>{const r=e.athleteId?athleteById(e.athleteId):null;const nm=r?r.athlete.nome:(e.name||'?');const ico=e.type==='goal'?'⚽':(e.type==='yellow'?'🟨':'🟥');return`<div class="evrow"><span class="who">${ico} ${esc(nm)}</span><span class="tm">${teamNameById(e.teamId)}</span><button class="lnk" onclick="suDel(${i})">✕</button></div>`;}).join('')||'<p class="dim" style="margin:6px 0">Nenhum lance registrado.</p>';
  const teamPicker=sides.map(tid=>{const t=teamById(tid);const ros=(t&&t.roster)||[];return `<div style="margin-bottom:12px"><div style="font-weight:700;margin-bottom:6px">${esc(t?t.nome:'?')}</div>${ros.length?ros.map(a=>`<div class="evrow"><span class="who">${a.numero?'#'+esc(a.numero)+' ':''}${esc(a.nome)}</span><span class="evbtns"><button class="ev" onclick="suAdd('${tid}','${a.id}','goal')">⚽</button><button class="ev" onclick="suAdd('${tid}','${a.id}','yellow')">🟨</button><button class="ev" onclick="suAdd('${tid}','${a.id}','red')">🟥</button></span></div>`).join(''):`<p class="dim" style="font-size:13px">Sem elenco. <button class="lnk" onclick="closeModal();currentTab='elenco';renderManage()">Cadastrar no Elenco →</button></p>`}<div class="evbtns" style="margin-top:5px"><button class="ev" onclick="suAddAnon('${tid}','goal')">+ ⚽ s/ atleta</button><button class="ev" onclick="suAddAnon('${tid}','yellow')">+ 🟨</button><button class="ev" onclick="suAddAnon('${tid}','red')">+ 🟥</button></div></div>`;}).join('');
  $('#modalBox').innerHTML=`<h3>📋 Súmula</h3><p class="muted" style="margin-bottom:12px;font-size:14px">${sides.map(tid=>esc((teamById(tid)||{}).nome||'?')).join(' × ')}</p>

}

pate, 0 é melhor que −1; −1 é melhor que −4.</div></div>`:''}

function criteriaEditor(d){
  const order=(d.cfg.criterios&&d.cfg.criterios.length?d.cfg.criterios:['P','V','SG','GP','DISC']).slice();
  const tail=order.filter(c=>c!=='P');
  const pool=['V','SG','GP','GC','CD','DISC'].filter(c=>!order.includes(c));
  const fixed=`<div class="critrow fixed"><span class="cnum">1</span><span class="cname">Pontos</span><span class="dim" style="font-size:11px">principal</span></div>`;
  const rows=tail.map((c,i)=>`<div class="critrow"><span class="cnum">${i+2}</span><span class="cname">${CRIT_LABEL[c]}${c==='DISC'?'<small class="dim" style="display:block;font-size:11px">0 é melhor que -1</small>':''}</span><span class="cbtns"><button class="lnk" title="Aumentar importância" aria-label="Aumentar importância" onclick="critMove(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="lnk" title="Reduzir importância" aria-label="Reduzir importância" onclick="critMove(${i},1)" ${i===tail.length-1?'disabled':''}>↓</button><button class="lnk danger" title="Remover critério" aria-label="Remover critério" onclick="critRemove(${i})">×</button></span></div>`).join('');
  const add=pool.length?`<div class="row" style="margin-top:8px;align-items:center"><select id="critAddSel" style="flex:1">${pool.map(c=>`<option value="${c}">${CRIT_LABEL[c]}</option>`).join('')}</select><button class="btn ghost sm" onclick="critAdd()">+ Incluir</button></div>`:'';
  return `<div class="banner" style="margin-bottom:10px"><b>Como funciona:</b> o critério no topo tem maior importância. Pontos é fixo em primeiro; use ↑ e ↓ para ordenar os demais. Selecione <b>Disciplina (fair-play)</b> para usar cartões como desempate.</div><div class="critlist">${fixed}${rows}</div>${add}`;
}
function critTail(){const o=(state.cfg.criterios||['P','V','SG','GP','DISC']).slice();return o.filter(c=>c!=='P');}
function critCommit(tail){state.cfg.criterios=['P'].concat(tail);persist();renderManage();}
function critMove(i,dir){const t=critTail();const j=i+dir;if(j<0||j>=t.length)return;[t[i],t[j]]=[t[j],t[i]];critCommit(t);}
function critRemove(i){const t=critTail();t.splice(i,1);critCommit(t);}
function critAdd(){const sel=document.getElementById('critAddSel');if(!sel||!sel.value)return;const t=critTail();if(!t.includes(sel.value))t.push(sel.value);critCommit(t);}
function clearResults(){(state.matches||[]).forEach(m=>{m.hg=null;m.ag=null;m.events=[];});if(state.bracket){if(state.formato==='mata'){state.bracket.rounds.forEach(rd=>rd.forEach(t=>{t.ag1=t.bg1=t.ag2=t.bg2=t.apen=t.bpen=null;t.events=[];}));if(state.bracket.third){state.bracket.third.ag1=state.bracket.third.bg1=state.bracket.third.ag2=state.bracket.third.bg2=state.bracket.third.apen=state.bracket.third.bpen=null;state.bracket.third.events=[];}advanceBracket(state);}else state.bracket=null;}persist();renderManage();toast('Resultados zerados');}

function reportBase(title,subtitle){
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('Biblioteca de PDF não carregou (precisa de internet)');return null;}
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'p',unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(20,60,40);doc.text(state.nome||'Campeonato',40,44);
  doc.setFontSize(13);doc.setTextColor(26,120,70);doc.text(title,40,66);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(110);doc.text([activeCategory()?.nome,activePhase()?.nome,subtitle].filter(Boolean).join(' · '),40,82);
  doc.setFont('helvetica','bold');doc.setTextColor(170);doc.text('ARENA',W-40,44,{align:'right'});
  return {doc,y:102,opt:{theme:'grid',styles:{fontSize:9,cellPadding:4},headStyles:{fillColor:[26,163,83],textColor:255},margin:{left:40,right:40}}};
}
function reportName(suffix){return ((state.nome||'campeonato')+'_'+(activeCategory()?.nome||'categoria')+'_'+suffix).replace(/[^\w\-]+/g,'_')+'.pdf';}

/* ---------- PDF ---------- */
function standsToRows(st){return st.map((s,i)=>[i+1,state.teams[s.team].nome,s.P,s.J,s.V,s.E,s.D,s.GP,s.GC,(s.SG>0?'+':'')+s.SG,s.pct.toFixed(1)]);}
function exportPDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF))return toast('Biblioteca de PDF não carregou (precisa de internet)');
  ensureEvents();
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'p',unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth();let y=46;
  const opt={theme:'grid',styles:{fontSize:9,cellPadding:4},headStyles:{fillColor:[26,163,83],textColor:255},columnStyles:{1:{halign:'left'}},margin:{left:40,right:40}};
  const pageGuard=(need)=>{if(y>800-(need||40)){doc.addPage();y=46;}};
  const sectionTitle=(txt)=>{pageGuard(60);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(26,120,70);doc.text(txt,40,y);y+=4;};
  // cabeçalho
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(20,60,40);doc.text(state.nome||'Campeonato',40,y);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(120);doc.text(FORMATS[state.formato].nome+'  ·  '+new Date().toLocaleDateString('pt-BR'),40,y+16);
  doc.setTextColor(170);doc.setFont('helvetica','bold');doc.text('ARENA',W-40,y,{align:'right'});y+=40;
  const head=[['#','Equipe','P','J','V','E','D','GP','GC','SG','%']];
  // CLASSIFICAÇÃO
  const blocks=[];
  if(state.formato==='liga')blocks.push({title:null,st:computeStandings(state.teams.map((_,i)=>i),state.matches)});
  else if(state.formato==='grupos')state.grupos.forEach((g,gi)=>{const idxs=g.map(id=>state.teams.findIndex(t=>t.id===id));blocks.push({title:'Grupo '+String.fromCharCode(65+gi),st:computeStandings(idxs,state.matches.filter(m=>m.grupo===gi))});});
  else if(state.formato==='gxg'){const A=state.grupos[0].map(id=>state.teams.findIndex(t=>t.id===id));const B=state.grupos[1].map(id=>state.teams.findIndex(t=>t.id===id));blocks.push({title:'Grupo A',st:computeStandings(A,state.matches)});blocks.push({title:'Grupo B',st:computeStandings(B,state.matches)});}
  if(blocks.length){sectionTitle('Classificação');y+=6;blocks.forEach(b=>{if(b.title){pageGuard(50);doc.setFontSize(11);doc.setTextColor(40);doc.text(b.title,40,y);y+=4;}doc.autoTable(Object.assign({},opt,{startY:y+4,head:head,body:standsToRows(b.st)}));y=doc.lastAutoTable.finalY+18;});}
  // JOGOS / CONFRONTOS
  const tn=id=>{const i=state.teams.findIndex(x=>x.id===id);return i>=0?state.teams[i].nome:'—';};
  if(state.matches&&state.matches.length){
    sectionTitle('Tabela de jogos');
    let games;
    if(state.formato==='grupos')games=state.grupos.map((_,gi)=>({label:'Grupo '+String.fromCharCode(65+gi),ms:state.matches.filter(m=>m.grupo===gi)}));
    else if(state.formato==='gxg')games=[{label:'Interzonas A × B',ms:state.matches}];
    else games=[{label:null,ms:state.matches}];
    games.forEach(g=>{if(g.label){y+=14;pageGuard(40);doc.setFontSize(11);doc.setTextColor(40);doc.text(g.label,40,y);}const body=g.ms.slice().sort((a,b)=>a.rodada-b.rodada).map(m=>{const sc=(m.hg!=null&&m.ag!=null)?`${m.hg} x ${m.ag}`:'– x –';return [m.rodada+'ª',tname(m.home),sc,tname(m.away),m.info||''];});doc.autoTable(Object.assign({},opt,{startY:y+8,head:[['Rod.','Mandante','Placar','Visitante','Data/Local']],body,columnStyles:{1:{halign:'right'},3:{halign:'left'},4:{halign:'left',fontSize:8}}}));y=doc.lastAutoTable.finalY+14;});
  }
  if(state.bracket){
    sectionTitle('Chaveamento');const single=state.cfg.maoUnica;const body=[];
    const rowFor=(t,fase)=>{if(t.a==null&&t.b==null)return;const sc=single?`${t.ag1??'-'} x ${t.bg1??'-'}`:`${(t.ag1==null&&t.ag2==null)?'-':((t.ag1||0)+(t.ag2||0))} x ${(t.bg1==null&&t.bg2==null)?'-':((t.bg1||0)+(t.bg2||0))}`;const pen=(t.apen!=null&&t.bpen!=null)?` (pên ${t.apen}x${t.bpen})`:'';body.push([fase,tn(t.a)+' x '+tn(t.b),sc+pen,t.winner?tn(t.winner):'']);};
    state.bracket.rounds.forEach(rd=>{const size=rd.length*2;rd.forEach(t=>rowFor(t,ROUND_NAMES[size]||(size+'-avos')));});
    if(state.bracket.third)rowFor(state.bracket.third,'3º lugar');
    doc.autoTable(Object.assign({},opt,{startY:y+8,head:[['Fase','Confronto','Placar','Classificado']],body,columnStyles:{1:{halign:'left'},3:{halign:'left'}}}));y=doc.lastAutoTable.finalY+16;
  }
  // ARTILHARIA
  const sc=scorerRanking();
  if(sc.length){sectionTitle('Artilharia');doc.autoTable(Object.assign({},opt,{startY:y+8,head:[['#','Atleta','Equipe','Gols']],body:sc.map((r,i)=>[i+1,r.name,r.teamId?tn(r.teamId):'—',r.goals]),columnStyles:{1:{halign:'left'},2:{halign:'left'}}}));y=doc.lastAutoTable.finalY+16;}
  // DISCIPLINA
  const cr=cardRanking();
  if(cr.length){sectionTitle('Disciplina (cartões)');doc.autoTable(Object.assign({},opt,{startY:y+8,head:[['#','Atleta','Equipe','Amarelos','Vermelhos']],body:cr.map((r,i)=>[i+1,r.name,r.teamId?tn(r.teamId):'—',r.y,r.r]),columnStyles:{1:{halign:'left'},2:{halign:'left'}}}));y=doc.lastAutoTable.finalY+16;}
  doc.save((state.nome||'campeonato').replace(/[^\w\-]+/g,'_')+'.pdf');toast('PDF gerado');
}

/* ---------- SÚMULA DA PARTIDA (em branco, para impressão) ---------- */
function matchContext(kind,id){
  if(kind==='match'){const m=state.matches.find(x=>x.id===id);if(!m)return null;
    let fase='Fase de classificação',rod=m.rodada+'ª rodada';
    if(state.formato==='grupos')fase='Grupo '+String.fromCharCode(65+(m.grupo||0));
    else if(state.formato==='gxg')fase='Interzonas (A × B)';
    else if(state.formato==='liga')fase='Pontos corridos';
    const mx=matchMeta(m),vv=venueById(mx.venueId),rr=officialById(mx.refereeId),tt=officialById(mx.tableOfficialId);return{home:teamById(state.teams[m.home].id),away:teamById(state.teams[m.away].id),fase,rodada:rod,info:metaLine(m),meta:mx,venue:vv,referee:rr,tableOfficial:tt};
  } else {const t=findTie(id);if(!t)return null;let fase='Mata-mata';
    for(const rd of state.bracket.rounds){if(rd.includes(t)){fase=ROUND_NAMES[rd.length*2]||(rd.length*2+'-avos');break;}}
    if(state.bracket.third&&state.bracket.third.id===id)fase='Disputa de 3º lugar';
    return{home:t.a?teamById(t.a):null,away:t.b?teamById(t.b):null,fase,rodada:'',info:[t.info1,t.info2].filter(Boolean).join('  |  ')};
  }
}
function splitInfo(info){ // tenta separar "data · hora · local"
  if(!info)return{data:'',hora:'',local:''};
  const parts=info.split(/[·|]/).map(s=>s.trim());
  return{data:parts[0]||'',hora:parts[1]||'',local:parts.slice(2).join(' · ')||(parts.length<3?(parts[1]?'':parts[1]):'')};
}
function printSumula(kind,id){
  if(!(window.jspdf&&window.jspdf.jsPDF))return toast('Biblioteca de PDF não carregou (precisa de internet)');
  const ctx=matchContext(kind,id);if(!ctx)return toast('Jogo não encontrado');
  const sport=(state.cfg&&state.cfg.esporte)||'futebol';
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'p',unit:'pt',format:'a4'});
  const W=doc.internal.pageSize.getWidth(),M=38;let y=40;
  const GREEN=[26,163,83],DARK=[20,40,30],GREY=[120,120,120],LINE=[200,200,200];
  // cabeçalho
  doc.setFillColor.apply(doc,GREEN);doc.rect(M,y,26,26,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('A',M+8,y+18);
  doc.setTextColor.apply(doc,DARK);doc.setFontSize(16);doc.text('SÚMULA DE JOGO',M+34,y+12);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor.apply(doc,GREY);doc.text(SPORTS[sport]+'  ·  ARENA Campeonatos',M+34,y+24);
  doc.setFontSize(8);doc.text('Documento gerado pela ARENA — não substitui a súmula oficial da federação.',W-M,y+8,{align:'right'});
  y+=40;doc.setDrawColor.apply(doc,GREEN);doc.setLineWidth(1.4);doc.line(M,y,W-M,y);y+=16;
  // bloco de cabeçalho do jogo
  const info=splitInfo(ctx.info);
  doc.setFontSize(10);doc.setTextColor.apply(doc,DARK);
  const field=(label,val,x,w)=>{doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor.apply(doc,GREY);doc.text(label.toUpperCase(),x,y);doc.setDrawColor.apply(doc,LINE);doc.setLineWidth(.6);doc.line(x,y+15,x+w,y+15);if(val){doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor.apply(doc,DARK);doc.text(String(val),x+2,y+12);}};
  const cw=(W-2*M);
  field('Campeonato',state.nome||'',M,cw*0.62-8);field('Modalidade',SPORTS[sport],M+cw*0.62,cw*0.38);y+=30;
  field('Fase',ctx.fase||'',M,cw*0.34-8);field('Rodada/Jogo',ctx.rodada||'',M+cw*0.34,cw*0.30-8);field('Data',info.data||'',M+cw*0.64,cw*0.18-6);field('Horário',info.hora||'',M+cw*0.82,cw*0.18);y+=30;
  field('Local',(ctx.venue&&ctx.venue.name)||info.local||'',M,cw);y+=30;if(ctx.referee||ctx.tableOfficial){field('Árbitro',ctx.referee?ctx.referee.name:'',M,cw*.5-8);field('Mesário / auxiliar',ctx.tableOfficial?ctx.tableOfficial.name:'',M+cw*.5,cw*.5);y+=34;}else y+=4;
  // tabela de elenco por equipe
  const ROWS=sport==='basquete'?12:(sport==='volei'?14:(sport==='handebol'?16:18));
  function rosterRows(team){const r=(team&&team.roster)||[];const out=[];for(let i=0;i<ROWS;i++){const a=r[i];out.push([a&&a.numero?('#'+a.numero):'', a?a.nome:'', '', '']);}return out;}
  const sideHead=sport==='volei'
    ? [['Nº','Atleta','Capitão','Líbero']]
    : (sport==='basquete'
      ? [['Nº','Atleta','Faltas','Pts']]
      : [['Nº','Atleta','Gols','Cartões']]);
  const teamTable=(team,x,wd)=>{
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor.apply(doc,GREEN);
    doc.text((team?team.nome:'________________').toUpperCase(),x,y);
    doc.autoTable({startY:y+6,margin:{left:x},tableWidth:wd,theme:'grid',styles:{fontSize:8,cellPadding:3,minCellHeight:15,lineColor:LINE},headStyles:{fillColor:GREEN,textColor:255,fontSize:8},columnStyles:{0:{cellWidth:24,halign:'center'},1:{halign:'left'},2:{cellWidth:34,halign:'center'},3:{cellWidth:38,halign:'center'}},head:sideHead,body:rosterRows(team)});
    // comissão técnica
    const st=(team&&team.staff)||{};let yy=doc.lastAutoTable.finalY+8;
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor.apply(doc,GREY);doc.text('COMISSÃO TÉCNICA',x,yy);yy+=4;
    const staffLine=(lb,v)=>{yy+=14;doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor.apply(doc,GREY);doc.text(lb+':',x,yy);doc.setDrawColor.apply(doc,LINE);doc.line(x+58,yy+2,x+wd,yy+2);if(v){doc.setTextColor.apply(doc,DARK);doc.text(String(v),x+62,yy);}};
    staffLine('Técnico',st.tecnico);staffLine('Auxiliar',st.auxiliar);staffLine('Prep. físico',st.preparador);staffLine('Médico/Fisio',st.medico);
    return yy;
  };
  const colW=(cw-16)/2;
  const yA=teamTable(ctx.home,M,colW);
  const yB=teamTable(ctx.away,M+colW+16,colW);
  y=Math.max(yA,yB)+22;
  // bloco específico do esporte
  if(y>past(700)){doc.addPage();y=44;}
  sportBlock(doc,sport,M,y,W,ctx);
  doc.save('sumula_'+(ctx.home?ctx.home.nome:'A').replace(/[^\w]+/g,'')+'_x_'+(ctx.away?ctx.away.nome:'B').replace(/[^\w]+/g,'')+'.pdf');
  toast('Súmula gerada');
}
function past(v){return v;} // helper de leitura
function sportBlock(doc,sport,M,y,W,ctx){

    y=doc.lastAutoTable.finalY+14;title('FALTAS COLETIVAS POR PERÍODO');
    doc.autoTable({startY:y+4,margin:{left:M},theme:'grid',styles:{fontSize:9,cellPadding:5,minCellHeight:18,halign:'center',lineColor:LINE},headStyles:{fillColor:GREEN,textColor:255},head:[['Equipe','1º Q','2º Q','3º Q','4º Q']],body:[[A,'','','',''],[B,'','','','']],columnStyles:{0:{halign:'left'}}});

    title('PLACAR POR TEMPO');
    doc.autoTable({startY:y+4,margin:{left:M},theme:'grid',styles:{fontSize:9,cellPadding:5,minCellHeight:20,halign:'center',lineColor:LINE},headStyles:{fillColor:GREEN,textColor:255},head:[['Equipe','1º Tempo','2º Tempo','Prorrog.','Final']],body:[[A,'','','',''],[B,'','','','']],columnStyles:{0:{halign:'left'}}});
    y=doc.lastAutoTable.finalY+14;title('EXCLUSÕES (2 MIN) / DESQUALIFICAÇÕES');

  } else { // futebol / futsal / society / outro

  sig('Árbitro',M,sw);sig('Representante '+A,M+sw+15,sw);sig('Representante '+B,M+2*sw+30,sw);
}

function exportJSON(){if(!state)return;const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(state.nome||'campeonato').replace(/[^\w\-]+/g,'_')+'.json';a.click();toast('Exportado');}
function importJSON(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const t=JSON.parse(r.result);if(!t.cfg||!t.formato)throw 0;t.id=uid();t.cfg.seedNames=t.cfg.seedNames||[];await Store.create(t);toast('Importado para sua conta');renderHome();}catch(e){toast('Arquivo inválido');}};r.readAsText(f);};inp.click();}


/* ============================================================
   ARENA 2.0 — INSCRIÇÕES POR LINK
   Formulário público -> fila de análise -> aprovação -> equipe/elenco.
   Os pedidos ficam em championships/{id}/registrations.
   ============================================================ */
const RegistrationStore={
  col(cid){return fbDb.collection('championships').doc(cid).collection('registrations');},
  async submit(cid,obj){const ref=this.col(cid).doc();await ref.set(Object.assign({},obj,{id:ref.id,status:'pending',created:Date.now(),updated:Date.now()}));return ref.id;},
  subscribe(cid,cb){return this.col(cid).orderBy('created','desc').onSnapshot(q=>{const a=[];q.forEach(d=>a.push(Object.assign({id:d.id},d.data())));cb(a,null);},e=>cb([],e));},
  async update(cid,id,data){await this.col(cid).doc(id).update(Object.assign({},data,{updated:Date.now()}));}
};
let registrationUnsub=null,registrationRows=[];
function registrationCfg(){state.registration=state.registration||{};if(state.registration.open==null)state.registration.open=true;if(state.registration.maxAthletes==null)state.registration.maxAthletes=30;if(state.registration.maxTeamsPerCategory==null)state.registration.maxTeamsPerCategory=0;if(state.registration.deadline==null)state.registration.deadline='';return state.registration;}
function registrationDeadlineClosed(cfg){if(!cfg.deadline)return false;const end=new Date(cfg.deadline+'T23:59:59');return Date.now()>end.getTime();}
function categoryTeamLimitReached(cat,cfg){return !!(cfg.maxTeamsPerCategory>0&&cat&&(cat.teams||[]).length>=cfg.maxTeamsPerCategory);}
function docsLabel(s){return({pending:'Documentação pendente',ok:'Documentação conferida',issue:'Documentação com pendência'}[s]||'Documentação pendente');}
function registrationStatusLabel(s){return({pending:'Pendente',approved:'Aprovada',rejected:'Recusada'}[s]||s);}
function viewInscricoesShell(){const c=registrationCfg(),pending=registrationRows.filter(x=>x.status==='pending').length;return `<div class="card pad"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3 style="font-size:22px">📝 Inscrições por link</h3><p class="muted" style="margin:4px 0 0">Receba equipes e atletas sem dar acesso ao painel administrativo.</p></div><span class="tag ${c.open&&!registrationDeadlineClosed(c)?'acc':''}">${c.open&&!registrationDeadlineClosed(c)?'ABERTAS':'FECHADAS'}</span></div><div class="banner" style="margin-top:16px"><code>${esc(registrationLinkFor(state.id))}</code><button class="btn primary sm" onclick="copyRegistrationLink('${state.id}')">Copiar link</button></div><div class="row" style="margin-top:12px"><label class="fld" style="flex:1;min-width:190px"><span>Receber inscrições</span><select onchange="registrationCfg().open=this.value==='1';persist();renderManage()"><option value="1" ${c.open?'selected':''}>Sim</option><option value="0" ${!c.open?'selected':''}>Não</option></select></label><label class="fld" style="flex:1;min-width:190px"><span>Prazo final</span><input type="date" value="${esc(c.deadline||'')}" onchange="registrationCfg().deadline=this.value;persist();renderManage()"></label><label class="fld" style="flex:1;min-width:190px"><span>Máx. equipes / categoria</span><input type="number" min="0" value="${c.maxTeamsPerCategory||0}" onchange="registrationCfg().maxTeamsPerCategory=Math.max(0,+this.value||0);persist()"><div class="hint">0 = sem limite</div></label><label class="fld" style="flex:1;min-width:190px"><span>Máx. atletas / equipe</span><input type="number" min="1" max="100" value="${c.maxAthletes}" onchange="registrationCfg().maxAthletes=Math.max(1,+this.value||30);persist()"></label></div><div class="hint">${pending} inscrição(ões) aguardando análise.${c.deadline?' Prazo: '+new Date(c.deadline+'T12:00:00').toLocaleDateString('pt-BR')+'.':''} O envio público só entra na competição após aprovação.</div></div><div class="card pad" style="margin-top:14px"><div class="row" style="justify-content:space-between"><div><h3 style="font-size:20px">🪪 Carteirinhas</h3><p class="muted" style="margin:3px 0 0">Gere credenciais em PDF para os atletas já aprovados.</p></div><select id="cardCat" style="max-width:260px">${(state.categories||[]).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div><button class="btn ghost sm" style="margin-top:10px" onclick="exportAthleteCards()">Gerar carteirinhas com QR Code</button></div><div id="registrationList" style="margin-top:14px"></div>`;} 
function renderInscricoes(c){c.innerHTML=viewInscricoesShell();if(registrationUnsub)registrationUnsub();registrationUnsub=RegistrationStore.subscribe(state.id,(rows,err)=>{registrationRows=rows;if(err){const h=$('#registrationList');if(h)h.innerHTML=`<div class="card pad"><p class="muted">Não foi possível carregar inscrições: ${esc(err.message||err)}</p><p class="hint">Confira as regras do Firestore para a subcoleção registrations.</p></div>`;return;}renderRegistrationList();});}
function renderRegistrationList(){const h=$('#registrationList');if(!h)return;if(!registrationRows.length){h.innerHTML='<div class="card pad empty"><div class="ic">📝</div><p>Nenhuma inscrição recebida ainda.</p></div>';return;}h.innerHTML=registrationRows.map(r=>`<div class="card pad" style="margin-bottom:10px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h4 style="font-size:19px">${esc(r.teamName||'Equipe')}</h4><div class="muted">${esc(r.categoryName||'Categoria não informada')} · ${esc(r.responsible||'Responsável não informado')} ${r.phone?'· '+esc(r.phone):''}</div></div><span class="tag ${r.status==='approved'?'acc':r.status==='rejected'?'bad':''}">${registrationStatusLabel(r.status)}</span></div><div class="hint" style="margin-top:8px">${(r.athletes||[]).length} atleta(s) · enviada em ${new Date(r.created||Date.now()).toLocaleString('pt-BR')}</div>${r.notes?`<p style="margin:10px 0">${esc(r.notes)}</p>`:''}<details style="margin-top:8px"><summary>Ver elenco</summary><div style="margin-top:8px">${(r.athletes||[]).map(a=>`<div class="evrow"><span class="who">${esc(a.name||'')}</span><span class="tm">${a.number?'#'+esc(a.number):''}${a.dob?' · '+esc(a.dob):''}</span></div>`).join('')||'<span class="dim">Sem atletas.</span>'}</div></details><div class="row" style="margin-top:10px;align-items:end"><label class="fld" style="min-width:230px;margin:0"><span>Situação documental</span><select onchange="setRegistrationDocs('${r.id}',this.value)"><option value="pending" ${(r.docsStatus||'pending')==='pending'?'selected':''}>Documentação pendente</option><option value="ok" ${r.docsStatus==='ok'?'selected':''}>Documentação conferida</option><option value="issue" ${r.docsStatus==='issue'?'selected':''}>Com pendência</option></select></label><span class="tag ${r.docsStatus==='ok'?'acc':r.docsStatus==='issue'?'bad':''}">${docsLabel(r.docsStatus)}</span></div>${r.status==='pending'?`<div class="row" style="margin-top:12px"><button class="btn primary sm" onclick="approveRegistration('${r.id}')">✓ Aprovar e importar</button><button class="btn ghost sm danger" onclick="rejectRegistration('${r.id}')">Recusar</button></div>`:''}</div>`).join('');}
async function setRegistrationDocs(id,value){try{await RegistrationStore.update(state.id,id,{docsStatus:value});toast('Situação documental atualizada');}catch(e){toast('Erro: '+(e.message||e));}}
async function approveRegistration(id){const r=registrationRows.find(x=>x.id===id);if(!r)return;if(!canAddTeams(state,1))return toast(freeTeamLimitMessage());const cat=(state.categories||[]).find(c=>c.id===r.categoryId)||activeCategory();if(!cat)return toast('Categoria não encontrada');const rcfg=registrationCfg();if(categoryTeamLimitReached(cat,rcfg))return toast('Limite de equipes desta categoria atingido');if(cat.teams.some(t=>(t.nome||'').toLowerCase()===(r.teamName||'').toLowerCase()))return toast('Já existe uma equipe com esse nome na categoria');const t={id:uid(),nome:r.teamName||'Nova equipe',roster:(r.athletes||[]).filter(a=>a.name).map(a=>({id:uid(),nome:a.name,numero:a.number||'',dob:a.dob||''})),staff:{tecnico:r.coach||r.responsible||''},registration:{responsible:r.responsible||'',phone:r.phone||'',email:r.email||'',sourceId:r.id}};cat.teams.push(t);if(cat.id===state.activeCategoryId){loadCategoryIntoRoot(cat);saveRootIntoActive();}persist();try{await RegistrationStore.update(state.id,id,{status:'approved',approvedAt:Date.now(),teamId:t.id});toast('Inscrição aprovada e equipe importada');}catch(e){toast('Equipe importada, mas houve erro ao atualizar o pedido: '+(e.message||e));}}
async function rejectRegistration(id){try{await RegistrationStore.update(state.id,id,{status:'rejected',rejectedAt:Date.now()});toast('Inscrição recusada');}catch(e){toast('Erro: '+(e.message||e));}}
function publicAthleteRows(n){return Array.from({length:n},(_,i)=>`<div class="row" style="margin-bottom:7px"><input class="reg-ath-name" type="text" placeholder="Atleta ${i+1} — nome completo" style="flex:2"><input class="reg-ath-num" type="number" placeholder="Nº" style="max-width:90px"><input class="reg-ath-dob" type="text" placeholder="Nascimento" style="flex:1"></div>`).join('');}
async function enterRegistration(cid){RO=true;renderHeaderActions();$('#app').innerHTML=loadingHTML('Abrindo inscrição...');let d;try{d=await PublicStore.get(cid);}catch(e){return $('#app').innerHTML=`<div class="card pad"><p>Não foi possível abrir o campeonato.</p></div>`;}if(!d)return $('#app').innerHTML='<div class="card pad"><p>Campeonato não encontrado.</p></div>';state=d;ensureCategories(state);const cfg=Object.assign({open:true,maxAthletes:30,maxTeamsPerCategory:0,deadline:''},state.registration||{});if(cfg.open===false||registrationDeadlineClosed(cfg))return $('#app').innerHTML=`<div class="card pad" style="max-width:700px;margin:50px auto"><h2>Inscrições encerradas</h2><p class="muted">${esc(state.nome)} não está recebendo novas inscrições neste momento.</p></div>`;const cats=state.categories||[];$('#app').innerHTML=`<div style="max-width:780px;margin:32px auto"><div class="card pad"><span class="tag acc">INSCRIÇÃO DE EQUIPE</span><h1 class="display" style="font-size:32px;margin-top:8px">${esc(state.nome)}</h1>${state.subtitulo?`<p class="muted">${esc(state.subtitulo)}</p>`:''}<hr class="sep"><label class="fld"><span>Categoria *</span><select id="reg_cat">${cats.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></label><label class="fld"><span>Nome da equipe *</span><input id="reg_team" type="text" maxlength="80" autocomplete="organization" placeholder="Ex.: 8º Ano A"></label><div class="row"><label class="fld" style="flex:1"><span>Responsável *</span><input id="reg_resp" type="text" maxlength="100" autocomplete="name"></label><label class="fld" style="flex:1"><span>Telefone / WhatsApp *</span><input id="reg_phone" type="tel" maxlength="24" autocomplete="tel"></label></div><div class="row"><label class="fld" style="flex:1"><span>E-mail</span><input id="reg_email" type="email" maxlength="120" autocomplete="email"></label><label class="fld" style="flex:1"><span>Técnico / professor</span><input id="reg_coach" type="text" maxlength="100"></label></div><hr class="sep"><div class="row" style="justify-content:space-between"><h3>Atletas</h3><span class="hint">máx. ${cfg.maxAthletes||30}</span></div><div id="publicAthletes">${publicAthleteRows(Math.min(5,cfg.maxAthletes||30))}</div><button class="btn ghost sm" onclick="addPublicAthleteRow()">+ Adicionar atleta</button><label class="fld" style="margin-top:14px"><span>Observações</span><textarea id="reg_notes" maxlength="800" style="min-height:80px"></textarea><input id="reg_site" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px"></label><label style="display:flex;gap:9px;align-items:flex-start;margin:12px 0"><input id="reg_ok" type="checkbox" style="width:auto;margin-top:4px"><span class="hint">Declaro que tenho legitimidade para fornecer estes dados ao organizador para inscrição e gestão esportiva desta competição e que li as informações de privacidade aplicáveis. Dados de menores exigem atenção específica do organizador e responsável.</span></label><button id="reg_submit" class="btn primary block" onclick="submitPublicRegistration('${cid}')">Enviar inscrição</button><p class="hint center">A inscrição ficará pendente até a aprovação do organizador. · <button class="lnk" onclick="renderPrivacyCenter()">Privacidade e LGPD</button></p></div></div>`;}
function addPublicAthleteRow(){const cfg=state.registration||{maxAthletes:30},h=$('#publicAthletes'),n=h.querySelectorAll('.reg-ath-name').length;if(n>=(cfg.maxAthletes||30))return toast('Limite de atletas atingido');const w=document.createElement('div');w.innerHTML=publicAthleteRows(1);h.appendChild(w.firstElementChild);}
async function submitPublicRegistration(cid){if(($('#reg_site')?.value||'').trim())return;const team=$('#reg_team').value.trim(),resp=$('#reg_resp').value.trim(),phone=$('#reg_phone').value.trim();if(!team||!resp||!phone)return toast('Preencha equipe, responsável e telefone');if(!$('#reg_ok').checked)return toast('Confirme os dados antes de enviar');const cat=(state.categories||[]).find(c=>c.id===$('#reg_cat').value);const cfg=Object.assign({maxTeamsPerCategory:0},state.registration||{});if(categoryTeamLimitReached(cat,cfg))return toast('Esta categoria já atingiu o limite de equipes');const names=[...document.querySelectorAll('.reg-ath-name')],nums=[...document.querySelectorAll('.reg-ath-num')],dobs=[...document.querySelectorAll('.reg-ath-dob')];const athletes=names.map((e,i)=>({name:e.value.trim(),number:nums[i]?nums[i].value:'',dob:dobs[i]?dobs[i].value.trim():''})).filter(a=>a.name);const obj={categoryId:cat?cat.id:'',categoryName:cat?cat.nome:'',teamName:team,responsible:resp,phone,email:$('#reg_email').value.trim(),coach:$('#reg_coach').value.trim(),notes:$('#reg_notes').value.trim(),athletes};const b=$('#reg_submit');b.disabled=true;b.textContent='Enviando...';try{await RegistrationStore.submit(cid,obj);$('#app').innerHTML=`<div class="card pad center" style="max-width:620px;margin:70px auto"><div style="font-size:46px">✓</div><h2>Inscrição enviada</h2><p class="muted">A equipe <b>${esc(team)}</b> foi enviada para análise do organizador de ${esc(state.nome)}.</p><p class="hint">A inscrição ainda não significa participação confirmada.</p></div>`;}catch(e){b.disabled=false;b.textContent='Enviar inscrição';toast('Não foi possível enviar. Verifique as permissões do Firestore.');}}


/* ---------- CARTEIRINHAS DE ATLETAS ---------- */
async function qrDataURL(text){if(typeof QRCode==='undefined')return null;try{return await QRCode.toDataURL(text,{width:180,margin:1});}catch(e){return null;}}
async function exportAthleteCards(){
  if(!(window.jspdf&&window.jspdf.jsPDF))return toast('Biblioteca de PDF não carregou');
  const sel=document.getElementById('cardCat'),cat=(state.categories||[]).find(c=>c.id===(sel?sel.value:''))||activeCategory();if(!cat)return toast('Categoria não encontrada');
  const athletes=[];(cat.teams||[]).forEach(t=>(t.roster||[]).forEach(a=>athletes.push({a,t})));if(!athletes.length)return toast('Nenhum atleta cadastrado nesta categoria');
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});const W=210,H=297,m=10,g=5,cw=(W-2*m-g)/2,ch=58;let idx=0;
  for(const it of athletes){if(idx&&idx%8===0)doc.addPage();const slot=idx%8,col=slot%2,row=Math.floor(slot/2),x=m+col*(cw+g),y=m+row*(ch+g);doc.setDrawColor(70);doc.roundedRect(x,y,cw,ch,3,3);doc.setFillColor(26,163,83);doc.roundedRect(x,y,cw,12,3,3,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('ARENA  •  CREDENCIAL',x+4,y+7.5);doc.setTextColor(30);doc.setFontSize(12);doc.text((it.a.nome||'Atleta').slice(0,30),x+4,y+20);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Equipe: '+(it.t.nome||'—').slice(0,28),x+4,y+27);doc.text('Categoria: '+(cat.nome||'—').slice(0,25),x+4,y+33);doc.text('Nº: '+(it.a.numero||'—')+'   Nasc.: '+(it.a.dob||'—'),x+4,y+39);const token=[state.id,cat.id,it.t.id,it.a.id].join(':');const qr=await qrDataURL((location.origin||'')+location.pathname+'?ver='+state.id+'&atleta='+encodeURIComponent(token));if(qr)doc.addImage(qr,'PNG',x+cw-24,y+27,19,19);doc.setFontSize(7);doc.setTextColor(110);doc.text('ID '+it.a.id.slice(0,12),x+4,y+51);idx++;}
  doc.save(((state.nome||'campeonato')+'_'+(cat.nome||'categoria')+'_carteirinhas').replace(/[^\w\-]+/g,'_')+'.pdf');toast('Carteirinhas geradas');
}

/* ---------- VIEWER (acompanhamento ao vivo) ---------- */
function enterViewer(id){
  RO=true;renderHeaderActions();$('#app').innerHTML=loadingHTML('Carregando campeonato...');
  try{viewerUnsub=PublicStore.subscribe(id,(doc,err)=>{
    if(err){$('#app').innerHTML=`<div class="empty card pad"><div class="ic">⚠️</div><p>Não foi possível carregar.<br><span class="dim">${esc(err.message||err)}</span></p></div>`;return;}
    if(!doc){$('#app').innerHTML=`<div class="empty card pad"><div class="ic">🔍</div><p>Campeonato não encontrado ou removido.</p></div>`;return;}
    state=doc;renderManage();
  });}catch(e){$('#app').innerHTML=`<div class="empty card pad"><div class="ic">⚠️</div><p>${esc(e.message||e)}</p></div>`;}
}

/* ---------- BOOT ---------- */
function boot(){
  setupPWA();
  const cfg=getConfig();
  if(!cfg){renderSetupFirebase();return;}
  if(typeof firebase==='undefined'){renderSetupFirebase('As bibliotecas do Firebase não carregaram (verifique a conexão).');return;}
  try{if(!firebase.apps.length)firebase.initializeApp(cfg);fbAuth=firebase.auth();fbDb=firebase.firestore();}
  catch(e){renderSetupFirebase('Erro ao iniciar Firebase: '+e.message);return;}
  const params=new URLSearchParams(location.search);
  const ins=params.get('inscrever');if(ins){enterRegistration(ins);return;}
  const ver=params.get('ver');if(ver){enterViewer(ver);return;}
   fbAuth.onAuthStateChanged(async u=>{DEMO_MODE=false;currentUser=u;if(!u){billingProfile=null;platformAdminProfile=null;renderLandingPage();}else{await Promise.all([loadBilling(),loadPlatformAdmin()]);renderHome();}renderHeaderActions();});
}
boot();
</script>
